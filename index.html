<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>دلبند | پوشاک بچه‌گانه</title>
<meta name="description" content="دلبند؛ رگال لباس‌های نرم و پاستلی کودک با قیمت عمده.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>(function(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('pre')})()</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Light.woff2') format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
:root{
  --wall:#ECE6EB;
  --ink:#2F2B30;
  --muted:#6E6770;
  --value:#558E97;
  --brand:#67A6B0;
  --a1:#9D9FE4;
  --a2:#E9ACA9;
  --paper:#FAF8F6;
  --line:#E5DFE3;
  --e:cubic-bezier(.2,.75,.2,1);
  --ns:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{scroll-behavior:smooth}
body{background:var(--wall);color:var(--ink);font-family:'YekanBakh','Yekan Bakh',Tahoma,'Segoe UI',system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.7}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}

/* ---------- nav ---------- */
#nav{position:fixed;top:0;left:0;right:0;height:68px;z-index:900;background:#fff;border-bottom:1px solid #e6e2e5;box-shadow:0 2px 8px rgba(47,43,48,.04);display:flex;align-items:center;justify-content:space-between;padding:0 28px;direction:rtl;font-size:14px}
.nav-right{display:flex;align-items:center;gap:34px;height:100%}
.brand{display:flex;align-items:center;height:46px;font-size:26px;font-weight:700;color:var(--ink);flex:none}
.brand img{height:100%;width:auto;display:block;object-fit:contain}
.links{display:flex;align-items:center;gap:6px;height:100%;white-space:nowrap}
.links a{position:relative;display:flex;align-items:center;height:100%;padding:0 14px;font-weight:500;color:#68626A;transition:color .2s}
.links a:hover{color:var(--ink)}
.links a::after{content:"";position:absolute;right:10px;left:10px;bottom:0;height:2.5px;border-radius:3px 3px 0 0;background:var(--brand);transform:scaleX(0);transition:transform .25s var(--e)}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.links a.on{color:var(--ink);font-weight:700}
.navr{display:flex;align-items:center;gap:12px}
.navtel{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:8px;border:1px solid #e2dde1;background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;transition:border-color .2s,background .2s}
.navtel:hover{border-color:var(--brand);background:#fff}
.navtel svg{width:16px;height:16px;fill:none;stroke:var(--value);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-sep{width:1px;height:22px;background:#e4dfe3}
.menu{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:8px;border:1px solid #e2dde1;background:#fff;color:var(--ink);font-size:13.5px;font-weight:500;transition:background .2s,border-color .2s}
.menu:hover{background:var(--paper);border-color:#cfc8cd}
.burger{width:18px;height:12px;position:relative;display:block}
.burger i{position:absolute;left:0;right:0;height:1.8px;border-radius:1px;background:var(--ink)}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:5px}.burger i:nth-child(3){top:10px}
#menuPanel{position:fixed;top:74px;left:28px;z-index:950;background:#fff;border:1px solid #e4dfe3;border-radius:12px;padding:8px;min-width:200px;box-shadow:0 12px 32px rgba(47,43,48,.1);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .35s var(--e),visibility 0s .25s;direction:rtl}
#menuPanel.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#menuPanel a{display:block;padding:10px 14px;font-size:14.5px;font-weight:500;border-radius:8px;color:var(--ink)}
#menuPanel a:hover{background:var(--paper);color:var(--value)}

/* ---------- hero ---------- */
.screen{display:block;padding-top:68px;position:relative;z-index:1}
.hero{position:relative;height:calc(100vh - 68px);height:calc(100svh - 68px);min-height:500px;overflow:hidden;touch-action:pan-y}
.wall{position:absolute;inset:0;background:
radial-gradient(70% 80% at 80% 40%,color-mix(in srgb,var(--wall) 70%,#fff) 0,transparent 70%),
linear-gradient(90deg,color-mix(in srgb,var(--wall) 93%,#3b2f45) 0%,color-mix(in srgb,var(--wall) 97%,#3b2f45) 30%,var(--wall) 60%,color-mix(in srgb,var(--wall) 96%,#fff) 100%)}
#frame{position:absolute;width:1440px;height:900px;transform-origin:0 0;direction:ltr}
#railsvg{position:absolute;left:0;top:0;width:1440px;height:900px;overflow:visible;clip-path:inset(-300px -300px -300px -300px);transition:clip-path .7s cubic-bezier(.65,0,.25,1);pointer-events:none}
body.detail #railsvg{clip-path:inset(-300px 46% -300px -300px)}
#floor{position:absolute;left:52px;width:600px;height:60px;background:radial-gradient(closest-side,rgba(70,60,90,.14),transparent);transition:top .55s var(--e);pointer-events:none}
.piece{position:absolute;left:0;top:0;background-repeat:no-repeat;transition:transform .55s var(--e),opacity .35s ease,filter .55s ease;pointer-events:none;will-change:transform}
#frame.slow .piece{transition:transform .7s cubic-bezier(.65,0,.25,1),opacity .55s ease,filter .55s ease}
#ui{position:absolute;inset:0;z-index:300;pointer-events:none}
.pe,.pe *{pointer-events:auto}

/* ---------- بخش توضیحات رگال ---------- */
#info{
  position:absolute;left:1076px;top:128px;width:336px;direction:rtl;text-align:right;
  padding:26px 26px 28px;
  background:var(--paper);
  border:1px solid #E3DCE0;
  border-radius:16px;
  box-shadow:0 16px 36px rgba(47,43,48,.07);
  transition:transform .75s cubic-bezier(.65,0,.2,1);
}
body.detail #info{transform:translateX(-328px)}
.ln{display:block;overflow:hidden;padding:2px 0}
.ln>span{display:block}
.sw{transition:opacity .22s ease,transform .32s var(--e)}
.sw.out{opacity:0;transform:translateY(5px)}

.ttl{margin-top:0;min-height:84px;white-space:nowrap;color:var(--ink)}
.ttl .ln:first-child{font-size:21px;font-weight:400;line-height:30px;color:var(--value)}
.ttl .ln:last-child{font-size:38px;font-weight:700;line-height:48px;color:var(--ink);margin-top:2px}
.rule{margin-top:14px;width:36px;height:2px;background:var(--brand);border-radius:2px}
.desc{margin-top:14px;font-size:15px;line-height:26px;color:var(--muted);width:auto;font-weight:400}

.specs{margin-top:18px;font-size:14px}
.specs li{padding:9px 2px;border-bottom:1px dashed #DFD8DC}
.specs li:last-child{border-bottom:0}
.specs li>span{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.specs b{font-weight:400;color:var(--muted);font-size:13.5px;flex:none}
.specs em{font-style:normal;color:var(--ink);font-weight:500;text-align:left;line-height:22px}

.specs li.pr{
  background:#F2ECE7;
  border:1px solid #E4DBD3;
  border-radius:11px;
  padding:11px 14px;
  margin-bottom:8px;
}
.specs .pr b{font-size:13.5px;color:#5A5357;font-weight:500}
.specs .pr em{color:var(--ink);font-weight:700;font-size:22px}
.specs .pr small{font-size:12.5px;font-weight:500;color:var(--muted);margin-right:3px}

.vbtn{
  margin-top:20px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:46px;border-radius:10px;background:var(--ink);color:#fff;
  font-size:15px;font-weight:500;transition:background .25s,transform .2s;
}
.vbtn:hover{background:var(--value);transform:translateY(-1px)}
.vbtn svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:1.7}

/* فلش‌های چپ و راست زیر رگال در نسخه دسکتاپ */
#pager{position:absolute;left:282px;top:768px;width:140px;display:flex;justify-content:space-between;align-items:center;direction:ltr}
#pager button{width:54px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid #DFD8DC;background:var(--paper);box-shadow:0 4px 12px rgba(47,43,48,.06);transition:background .2s,border-color .2s,transform .2s}
#pager button:hover{background:#fff;border-color:var(--brand);transform:translateY(-1px)}
#pager svg{width:26px;height:12px;stroke:var(--ink);fill:none;stroke-width:1.5;opacity:.8}
#pager button:hover svg{opacity:1;stroke:var(--value)}

#idx{position:absolute;left:40px;top:250px;font-size:12px;font-weight:500;color:var(--muted);text-align:center;direction:ltr;width:24px}
#idx .tr{width:1.5px;height:77px;background:rgba(47,43,48,.16);margin:12px auto 19px;position:relative}
#idx .fl{position:absolute;inset:0;background:var(--brand);transform-origin:top;transition:transform .55s var(--e)}
#foot{position:absolute;left:53px;top:858px;font-size:12.5px;color:var(--muted);direction:rtl;white-space:nowrap}
#foot a{color:var(--ink);font-weight:500}
#hint{position:absolute;left:640px;top:858px;display:flex;align-items:center;font-size:12px;color:var(--muted);direction:rtl;white-space:nowrap}
#hint svg{width:20px;height:10px;margin:0 14px;stroke:var(--muted);fill:none;stroke-width:1.2}

/* detail panel */
#panel{position:absolute;left:1098px;top:125px;width:292px;height:590px;direction:rtl;text-align:right;opacity:0;visibility:hidden;transform:translateX(46px);pointer-events:none;transition:opacity .45s ease,transform .7s var(--e),visibility 0s .5s}
body.detail #panel{opacity:1;visibility:visible;transform:none;transition-delay:.32s,.32s,0s;pointer-events:auto}
#panel>*{position:absolute}
.pback{top:0;right:0;display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:8px;background:#fff;border:1px solid #DFD8DC;font-size:13.5px;font-weight:500;color:var(--ink);transition:background .2s,border-color .2s}
.pback:hover{background:var(--paper);border-color:var(--brand)}
.pback svg{width:11px;height:11px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.ptabs{top:52px;left:0;right:0;display:flex;border-bottom:1px solid #E2DCE0}
.ptabs button{flex:1;font-size:12.5px;color:var(--muted);padding:7px 0 9px;position:relative}
.ptabs button.on{color:var(--ink);font-weight:700}
.ptabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--brand)}
#imgbox{top:96px;left:0;right:0;height:490px;background:#F4F0F2;border-radius:12px;overflow:hidden;border:1px solid #E6E0E4}

/* ---------- sections ---------- */
section.sec{padding:92px 8vw;position:relative;z-index:2}
.sec h2{font-size:30px;font-weight:700;line-height:1.5;color:var(--ink)}
.sec .sub{margin-top:8px;color:var(--muted);font-size:15.5px;font-weight:400;max-width:620px}
.sec .rule2{width:34px;height:2.5px;border-radius:2px;background:var(--brand);margin:18px 0 0}
#price{background:var(--paper)}
.grid{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:20px}
.card{background:#fff;border:1px solid #E8E2E6;border-radius:14px;padding:14px 14px 18px;cursor:pointer;transition:transform .3s var(--e),box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-3px);border-color:#D3C9CF;box-shadow:0 12px 28px rgba(47,43,48,.07)}
.th{height:236px;display:flex;align-items:center;justify-content:center;background:#F6F3F5;border-radius:10px}
.th i{display:block;height:88%;background-repeat:no-repeat}
.card h3{margin-top:14px;font-size:16.5px;font-weight:700;color:var(--ink)}
.card .pr{margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .pr small{font-size:12px;color:var(--muted)}
.card .pr b{font-size:19.5px;font-weight:700;color:var(--ink)}
.card .pr span{font-size:12.5px;color:var(--muted)}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:500;padding:2px 10px;border-radius:6px;border:1px solid #E5DFE3;background:var(--paper);color:#4A454B}
.chip.c2{border-color:#D8E8EB;background:#F2F8F9;color:#3F6D75}
.feats{margin-top:38px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.feat{padding:26px 24px;border-radius:14px;background:var(--paper);border:1px solid #E4DEE2}
.feat i{display:block;width:10px;height:10px;border-radius:50%;background:var(--brand);margin-bottom:14px}
.feat:nth-child(2) i{background:var(--a2)}
.feat h3{font-size:17.5px;font-weight:700}
.feat p{margin-top:6px;color:var(--muted);font-size:14.5px;font-weight:400}
#contact{background:#E8E1E6;text-align:center}
#contact .sub{margin-inline:auto}
.bigtel{display:inline-block;margin-top:28px;font-size:clamp(28px,5vw,44px);font-weight:500;letter-spacing:.04em;direction:ltr;border-bottom:2px solid var(--brand);padding-bottom:6px;color:var(--ink)}
.crow{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:10px;border:1px solid var(--ink);font-size:15px;font-weight:500;transition:background .25s,color .25s,border-color .25s}
.btn:hover,.btn.fill{background:var(--ink);color:#fff}
.btn.fill:hover{background:var(--value);border-color:var(--value)}
.cinfo{margin-top:24px;color:var(--muted);font-size:15px;line-height:2}
footer.fo{padding:26px 8vw 96px;text-align:center;font-size:13.5px;color:var(--muted);background:#E8E1E6;position:relative;z-index:2}
footer.fo a{color:var(--ink);font-weight:500;border-bottom:1px solid rgba(47,43,48,.3)}

.fab{position:fixed;right:18px;bottom:18px;z-index:960;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 20px;border-radius:12px;background:var(--ink);color:#fff;font-size:15px;font-weight:500;box-shadow:0 8px 24px rgba(47,43,48,.22);transition:transform .3s var(--e),background .25s;direction:rtl}
.fab:hover{transform:translateY(-2px);background:var(--value)}
.fab svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fab bdi{letter-spacing:.04em}

/* intro hide */
html.pre .piece,html.pre #railsvg,html.pre #nav,html.pre .fade0{opacity:0!important}
html.pre .ln>span{transform:translateY(105%);opacity:0}

/* ---------- gallery / extras ---------- */
#track{display:flex;width:100%;height:100%;direction:ltr;transition:transform .5s var(--e)}
.sl{flex:0 0 100%;position:relative;height:100%;overflow:hidden}
.sl .in{position:absolute}
.sl .in.empty{inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
#imgbox{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.1);font-size:20px;line-height:30px;z-index:3}
.gP{left:8px}.gN{right:8px}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:7px;z-index:3;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(47,43,48,.25);transition:all .3s}
.dots i.on{background:var(--brand);width:18px;border-radius:3px}
.totop{position:fixed;left:18px;bottom:18px;z-index:955;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid #E2DCE0;box-shadow:0 6px 18px rgba(0,0,0,.09);font-size:14px;font-weight:500;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .35s,transform .45s var(--e),visibility 0s .35s;direction:rtl}
.totop.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.totop svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.6}
.edge,.swhint,.mcall,#scrim{display:none}
.mi{display:none}
@keyframes edgep{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--d,6px))}}
@keyframes swh{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}

/* ---------- mobile ---------- */
@media (max-width:820px){
 .screen{padding-top:58px;min-height:100svh;height:auto;display:flex;flex-direction:column}
 /* ارتفاع ثابت برای رگال تا با تغییر متن پایین یا اسکرول، پوزیشن رگال اصلاً تکان نخورد */
 .hero{flex:none;height:clamp(320px,46svh,440px);min-height:320px;overflow:hidden}
 #nav{height:58px;padding:0 14px}
 .brand{height:40px;font-size:21px}
 .links,.navtel,.nav-sep{display:none}
 .menu{padding:6px 12px;font-size:13px}
 #menuPanel{top:64px;left:14px}
 #idx,#foot,#hint{display:none}

 /* کارت توضیحات موبایل بدون فلش‌های صفحه‌بندی */
 .mi{
   display:grid;flex:1 0 auto;position:relative;z-index:2;align-content:start;
   grid-template-columns:auto 1fr;
   grid-template-areas:"ttl ttl" "dsc dsc" "spc spc" "call btn";
   gap:8px 10px;
   padding:16px 16px calc(18px + env(safe-area-inset-bottom));
   background:var(--paper);
   border-top:1px solid #E3DCE0;
   border-radius:20px 20px 0 0;
   box-shadow:0 -8px 24px rgba(47,43,48,.07);
 }
 .mi #info{display:contents;padding:0;background:none;border:0;box-shadow:none}
 .mi #pager{display:none!important}
 .mi .rule{display:none}
 .mi .ttl{grid-area:ttl;display:flex;align-items:baseline;gap:.35em;min-height:0;margin:0}
 .mi .ttl .ln:first-child{font-size:17px;font-weight:500;line-height:26px;color:var(--value)}
 .mi .ttl .ln:last-child{font-size:24px;font-weight:700;line-height:30px;color:var(--ink);margin-top:0}
 .mi .desc{grid-area:dsc;margin:-2px 0 2px;width:auto;font-size:13.5px;line-height:21px;color:var(--muted);font-weight:400}
 .mi .desc .ln{display:inline}
 .mi .desc .ln>span{display:inline}
 .mi .desc .ln:first-child::after{content:" "}
 .mi .specs{grid-area:spc;margin:2px 0 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}
 .mi .specs li{border-bottom:0;padding:7px 6px}
 .mi .specs li.pr{grid-column:1/-1;padding:9px 12px;border-radius:10px;margin-bottom:2px}
 .mi .specs li:not(.pr){background:#fff;border:1px solid #E8E2E6;border-radius:10px;text-align:center}
 .mi .specs li:not(.pr)>span{display:block}
 .mi .specs li:not(.pr) b{display:block;font-size:10.5px;color:var(--muted);line-height:15px;margin-bottom:2px}
 .mi .specs li:not(.pr) em{display:block;text-align:center;line-height:17px;font-size:12px;font-weight:500;color:var(--ink)}
 .mi .specs .pr>span{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
 .mi .specs .pr b{font-size:13px;font-weight:500;color:#5A5357}
 .mi .specs .pr em{font-size:20px;font-weight:700;line-height:24px}
 .mi .specs .pr em small{font-size:12px}
 .mi .vbtn{grid-area:btn;margin:4px 0 0;justify-content:center;height:44px;border-radius:10px;background:var(--ink);color:#fff;padding:0 14px;font-size:14.5px;font-weight:500}
 .mi .vbtn svg{stroke:#fff}
 .mi .mcall{grid-area:call;margin-top:4px;display:flex;width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid #DFD8DC;align-items:center;justify-content:center}
 .mi .mcall svg{width:18px;height:18px;fill:none;stroke:var(--value);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  if(detail&&sl>.001&&!mq.matches){X=352+(X-352)*.36;S=scaleAt(X,sl);op=Math.min(op,.62);filt='blur(7px) saturate(.55) brightness(1.04)'}
  else if(hover>0&&!detail){if(sl===hover){dx=38*S;dy=6;rot=-6;k=1.035}else if(sl>hover){dx=18*S}}
  el.style.transform='translate('+(X-d.lo+dx)+'px,'+(railY(X)-9*S+dy)+'px) rotate('+rot+'deg) scale('+(S*k)+')';
  el.style.opacity=op;el.style.filter=filt;
  el.style.zIndex=z!=null?z:Math.round(100-sl);
}
function layout(){
  for(var i=0;i<N;i++){
    var sl=slotOf(i),op=1,o=ov[i],z;
    if(o){sl=o.slot;op=o.op;z=o.z}
    apply(i,sl,op,z);
  }
  var d=defs[cur];floor.style.top=(railY(352)+d.h*.93-26)+'px';
}
function noTrans(i,fn){var el=els[i];el.style.transition='none';fn();void el.offsetWidth;el.style.transition=''}

/* ====================== متن‌ها ====================== */
function fillText(){
  var p=P[cur];
  $('#t1').textContent=p.t1||'';$('#t2').textContent=p.t2||'';
  $('#d1').textContent=p.d1||'';$('#d2').textContent=p.d2||'';
  $('#sPrice').textContent=money(p.price);
  $('#sSize').textContent=fa(p.sizes);$('#sColor').textContent=fa(p.colors);$('#sMat').textContent=fa(p.material);
}
var swT;
function swapText(){
  $$('.sw').forEach(function(e){e.classList.add('out')});
  clearTimeout(swT);
  swT=setTimeout(function(){fillText();$$('.sw').forEach(function(e){e.classList.remove('out')})},140);
}
function updIndex(){$('#iNow').textContent=pad(cur+1);$('#iFill').style.transform='scaleY('+((cur+1)/N)+')'}
function afterChange(){
  swapText();updIndex();
  if(detail){si=0;renderPanel()}
}

/* ====================== پیمایش ====================== */
function next(){
  if(N<2)return;
  var now=performance.now();if(now-lastStep<95)return;lastStep=now;
  seenHint();var old=cur;
  cur=(cur+1)%N;hover=-1;
  if(ov[cur]){delete ov[cur];clearTimeout(tm[cur])}
  ov[old]={slot:-1.3,op:0};
  layout();afterChange();
  clearTimeout(tm[old]);
  tm[old]=setTimeout(function(){
    noTrans(old,function(){ov[old]={slot:slotOf(old),op:0};layout()});
    requestAnimationFrame(function(){delete ov[old];layout()});
  },360);
}
function prev(){
  if(N<2)return;
  var now=performance.now();if(now-lastStep<95)return;lastStep=now;
  seenHint();var last=(cur-1+N)%N;
  hover=-1;
  if(ov[last]){delete ov[last];clearTimeout(tm[last])}
  noTrans(last,function(){apply(last,-1.3,0,200)});
  cur=last;
  requestAnimationFrame(function(){layout()});
  afterChange();
}
function follow(k){
  if(k<=0||following)return;
  following=true;hover=k;layout();
  setTimeout(function(){
    for(var j=0;j<k;j++)(function(j){setTimeout(function(){lastStep=0;next()},j*120)})(j);
    setTimeout(function(){following=false},k*120+300);
  },260);
}

/* ====================== هاور و کلیک ====================== */
function toFrame(e){var r=frame.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function span(s){
  var i=(cur+s)%N,d=defs[i],X=hookX(s),S=scaleAt(X,s),top=railY(X)-9*S;
  return{l:X-d.lo*S,r:X+(d.w-d.lo)*S,t:top,b:top+d.h*S};
}
function hit(x,y){
  if(!N)return-1;
  var f=span(0);
  if(x>f.l+30&&x<f.r-20&&y>f.t+60&&y<f.b)return 0;
  if(detail)return-1;
  for(var s=1;s<N;s++){
    var a=span(s);
    if(a.r-6>=x){
      if(y>a.t+40&&y<a.b-10&&x>f.r-20)return s;
      return-1;
    }
  }
  return-1;
}
function setHover(h){
  var hv=h>0?h:-1;
  if(hv!==hover){hover=hv;layout()}
  hero.style.cursor=h>=0?'pointer':'';
}
hero.addEventListener('mousemove',function(e){
  if(!hasHover||detail||following||mq.matches)return;
  if(e.target.closest('.pe')){setHover(-1);return}
  var f=toFrame(e);setHover(hit(f.x,f.y));
});
hero.addEventListener('mouseleave',function(){if(!following)setHover(-1)});
hero.addEventListener('click',function(e){
  if(e.target.closest('.pe'))return;
  if(following)return;
  var f=toFrame(e),h=hit(f.x,f.y);
  if(h===0)setDetail(!detail);
  else if(h>0&&!detail)follow(h);
});

/* چرخ، کلید، و لمس هوشمند */
var acc=0;
hero.addEventListener('wheel',function(e){
  if(mq.matches||window.scrollY>8||!N)return;
  if(e.target.closest('#panel'))return;
  var f=toFrame(e);
  if(f.x>1060&&!detail)return;
  e.preventDefault();
  acc+=e.deltaY+e.deltaX;
  while(acc>=40){acc-=40;next()}
  while(acc<=-40){acc+=40;prev()}
},{passive:false});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key==='Escape'){setDetail(false);closeMenu()}
});

var tx=0,ty=0,tMode=null,tStepped=false;
hero.addEventListener('touchstart',function(e){
  if(e.touches.length!==1||e.target.closest('.pe')||e.target.closest('#nav')||e.target.closest('#menuPanel')){tMode='skip';return}
  tx=e.touches[0].clientX;
  ty=e.touches[0].clientY;
  tMode=null;
  tStepped=false;
},{passive:true});

hero.addEventListener('touchmove',function(e){
  if(tMode==='skip'||tMode==='scroll'||!e.touches.length)return;
  var dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
  var ax=Math.abs(dx),ay=Math.abs(dy);
  if(!tMode){
    if(ax<6&&ay<6)return;
    if(ay>ax*1.45){tMode='scroll';return}
    tMode='rack';
  }
  if(tMode==='rack'){
    e.preventDefault();
    if(!tStepped&&ax>=30){
      tStepped=true;
      dx<0?next():prev();
    }
  }
},{passive:false});

hero.addEventListener('touchend',function(e){
  if(tMode==='rack'&&!tStepped&&e.changedTouches.length){
    var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>=20)dx<0?next():prev();
  }
  tMode=null;tStepped=false;
},{passive:true});
hero.addEventListener('touchcancel',function(){tMode=null;tStepped=false},{passive:true});

$('#nextBtn').onclick=next;$('#prevBtn').onclick=prev;

/* ====================== نمای جزئیات ====================== */
var slowT;
function setDetail(on){
  if(on===detail||!N)return;
  detail=on;document.body.classList.toggle('detail',on);
  frame.classList.add('slow');clearTimeout(slowT);slowT=setTimeout(function(){frame.classList.remove('slow')},760);
  hover=-1;hero.style.cursor='';
  if(on){si=0;renderPanel()}
  try{var tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.BackButton&&mq.matches){on?tg.BackButton.show():tg.BackButton.hide()}}catch(e){}
  layout();
}
$('#viewBtn').onclick=function(){setDetail(true)};
$('#backBtn').onclick=function(){setDetail(false)};

var box=$('#imgbox'),track=$('#track'),si=0,slides=[];
function empty(inn){inn.className='in empty';inn.textContent='تصویری ثبت نشده'}
function contain(inn,url){inn.style.cssText='left:0;top:0;width:100%;height:100%;background:url("'+url+'") center/contain no-repeat'}
function cover(inn,url,sw,sh,ix,iy,iw,ih,bw,bh){
  var s=Math.max(bw/iw,bh/ih);
  inn.style.cssText='left:0;top:0;width:'+bw+'px;height:'+bh+'px;background:url("'+url+'") no-repeat;background-size:'+(sw*s)+'px '+(sh*s)+'px;background-position:'+(bw/2-(ix+iw/2)*s)+'px '+(bh/2-(iy+ih/2)*s)+'px';
}
function buildLayers(){
  var bw=box.clientWidth,bh=box.clientHeight;if(!bw||!bh)return;
  var p=P[cur],im=p.images||{},k=p.sprite;
  slides=[{},{},{}];(p.gallery||[]).forEach(function(u){slides.push({u:u})});
  track.innerHTML=slides.map(function(){return'<div class="sl"><div class="in"></div></div>'}).join('');
  var inn=$$('.sl .in',track);
  if(im.hanger)contain(inn[0],im.hanger);
  else if(k===1){
    var s=bw/990,h=1007*s;
    inn[0].style.cssText='left:0;top:'+((bh-h)/2)+'px;width:'+bw+'px;height:'+h+'px;background:url("'+D1URL+'") no-repeat;background-size:'+(2048*s)+'px '+(2048*s)+'px;background-position:'+(bw/2-503.5*s)+'px 0px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent)';
  }else if(k>=2&&k<=12){
    var d=SPR[k-1],w=d[2],hh=d[3],sc=Math.min(.9*bw/w,.88*bh/hh);
    inn[0].style.cssText='left:'+((bw-w*sc)/2)+'px;top:'+((bh-hh*sc)/2)+'px;width:'+w+'px;height:'+hh+'px;transform-origin:0 0;transform:scale('+sc+');background:url("'+GURL+'") no-repeat;background-size:3312px 2480px;background-position:'+(-d[0])+'px '+(-d[1])+'px';
  }else empty(inn[0]);
  [['fabric',1,0,1041,FURL,FX,FW,FY,FH],['detail',2,1041,0,TURL,TX,TW,TY,TH]].forEach(function(c){
    var t=inn[c[1]];
    if(im[c[0]]){t.style.cssText='left:0;top:0;width:100%;height:100%;background:url("'+im[c[0]]+'") center/cover no-repeat'}
    else if(k===1)cover(t,D1URL,2048,2048,c[2]+6,c[3]+6,995,995,bw,bh);
    else if(k>=2&&k<=12){var col=(k-1)%4,row=Math.floor((k-1)/4);cover(t,c[4],3312,2480,c[5][col]+6,c[7][row]+6,c[6][col]-12,c[8][row]-12,bw,bh)}
    else empty(t);
  });
  slides.forEach(function(sl,i){if(sl.u)inn[i].style.cssText='left:0;top:0;width:100%;height:100%;background:url("'+sl.u+'") center/cover no-repeat'});
}
function showSlide(anim){
  var n=slides.length;if(!n)return;
  track.style.transition=anim===false?'none':'';
  track.style.transform='translateX('+(-si*100)+'%)';
  $$('#ptabs button').forEach(function(b,i){b.classList.toggle('on',i===si)});
  $('#dots').innerHTML=slides.map(function(_,i){return'<i'+(i===si?' class="on"':'')+'></i>'}).join('');
}
function goSlide(i){var n=slides.length;si=((i%n)+n)%n;showSlide(true)}
function renderPanel(){
  buildLayers();
  if(si>=slides.length)si=0;
  $('#ptabs').innerHTML=slides.map(function(_,i){return'<button>'+esc(SITE.tabs[i]||('عکس '+fa(i+1)))+'</button>'}).join('');
  $$('#ptabs button').forEach(function(b,i){b.onclick=function(){goSlide(i)}});
  showSlide(false);
}
$('#gP').onclick=function(){goSlide(si-1)};$('#gN').onclick=function(){goSlide(si+1)};
var drag=null;
box.addEventListener('pointerdown',function(e){if(e.target.closest('.gnav'))return;drag={x:e.clientX,y:e.clientY,dx:0,mv:false,k:box.getBoundingClientRect().width/(box.clientWidth||1)}});
box.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.mv){if(Math.abs(dx)<6)return;if(Math.abs(dy)>Math.abs(dx)){drag=null;return}drag.mv=true;try{box.setPointerCapture(e.pointerId)}catch(_){}track.style.transition='none'}
  drag.dx=dx;track.style.transform='translateX(calc('+(-si*100)+'% + '+(dx/drag.k)+'px))';
});
function endDrag(){
  if(!drag)return;var d=drag;drag=null;
  if(!d.mv)return;
  if(d.dx<-40)goSlide(si+1);else if(d.dx>40)goSlide(si-1);else showSlide(true);
}
box.addEventListener('pointerup',endDrag);box.addEventListener('pointercancel',endDrag);

/* ====================== اندازه و چیدمان ====================== */
var ui=$('#ui'),mi=$('#mi'),panel=$('#panel'),movers=[$('#info'),$('#pager')];
var lastW=0;
function placeBlocks(){
  movers.forEach(function(m){(mq.matches?mi:ui).appendChild(m)});
  (mq.matches?document.body:ui).appendChild(panel);
}
function sizeAll(force){
  var vw=hero.clientWidth,vh=hero.clientHeight;
  if(mq.matches&&!force&&lastW===vw)return;
  lastW=vw;
  document.documentElement.style.setProperty('--ns',mq.matches?1:Math.max(.62,Math.min(1,window.innerWidth/1440)));
  if(!mq.matches){
    scale=Math.min(vw/1440,vh/900);
    frame.style.left='50%';frame.style.top='50%';
    frame.style.transform='translate('+(-720*scale)+'px,'+(-450*scale)+'px) scale('+scale+')';
  }else{
    /* پوزیشن رگال در موبایل کاملاً ثابت و متصل به بالای کادر */
    var topPad=14,botPad=14;
    scale=Math.max(.34,Math.min((vh-topPad-botPad)/705,vw/520));
    var x=Math.min(0,vw*.44-352*scale);
    var y=topPad-10*scale;
    frame.style.left='0';frame.style.top='0';
    frame.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')';
  }
}
function onResize(){placeBlocks();sizeAll(false);layout();if(detail)buildLayers()}
window.addEventListener('resize',onResize);

/* ====================== منو و تماس ====================== */
var menu=$('#menuPanel');
function closeMenu(){menu.classList.remove('open')}
$('#menuBtn').onclick=function(e){e.stopPropagation();menu.classList.toggle('open')};
document.addEventListener('click',function(e){if(!e.target.closest('#menuPanel'))closeMenu()});

function buildStatic(){
  var s=SITE,tel=phoneTel(s.phone),show=phoneShow(s.phone);
  var br=$('#brand');
  if(s.logo){
    br.innerHTML='<img src="'+esc(s.logo)+'" alt="'+esc(s.brand)+'" onerror="this.parentNode.textContent=this.alt">';
  }else{
    br.textContent=s.brand;
  }
  var ids=['hero','price','about','contact'];
  $('#links').innerHTML=s.nav.map(function(l,i){return'<a href="#'+ids[i]+'" data-s="'+ids[i]+'"'+(i===0?' class="on"':'')+'>'+esc(l)+'</a>'}).join('');
  menu.innerHTML=s.nav.map(function(l,i){return'<a href="#'+ids[i]+'">'+esc(l)+'</a>'}).join('')+'<a href="'+tel+'">☎ <bdi dir="ltr">'+show+'</bdi></a>';
  $$('bdi',$('#navtel')).forEach(function(b){b.textContent=show});$('#navtel').href=tel;
  $('#hint1').textContent=s.hint1;$('#hint2').textContent=s.hint2;
  $('#viewTxt').textContent=s.viewBtn;
  $('#lPrice').textContent=s.lPrice;$('#lSize').textContent=s.lSize;$('#lColor').textContent=s.lColor;$('#lMat').textContent=s.lMat;$('#unit').textContent=s.unit;
  $('#footTag').textContent=s.footTag;$('#footTel bdi').textContent=show;$('#footTel').href=tel;
  $('#iAll').textContent=pad(N);
  $('#priceT').textContent=s.priceTitle;$('#priceS').textContent=s.priceSub;
  $('#aboutT').textContent=s.aboutTitle;$('#aboutX').textContent=s.aboutText;
  $('#feats').innerHTML=(s.features||[]).map(function(f){return'<div class="feat"><i></i><h3>'+esc(f.t)+'</h3><p>'+esc(f.x)+'</p></div>'}).join('');
  $('#contactT').textContent=s.contactTitle;$('#contactX').textContent=s.contactText;
  $('#bigtel bdi').textContent=show;$('#bigtel').href=tel;$('#callBtn').href=tel;
  var tg=String(s.telegram||'').replace(/^@/,'').trim();
  if(tg){var b=$('#tgBtn');b.hidden=false;b.href='https://t.me/'+encodeURIComponent(tg)}
  var ci=[];if(s.address)ci.push(esc(fa(s.address)));if(s.hours)ci.push(esc(fa(s.hours)));
  $('#cinfo').innerHTML=ci.join('<br>');
  $('#fo').innerHTML=esc(s.footerText)+'<br>تماس: <a href="'+tel+'"><bdi dir="ltr">'+show+'</bdi></a>';
  $('#fab').href=tel;$('#fabTxt').textContent=show;$('#mcall').href=tel;
  $('#copyBtn').onclick=function(){
    var t=String(s.phone),b=this,done=function(){b.textContent='کپی شد ✓';setTimeout(function(){b.textContent='کپی شماره'},1800)};
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,done);else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}
  };
  /* لیست قیمت */
  $('#grid').innerHTML=P.map(function(p,i){
    var d=defs[i],th;
    if(d.custom)th='<i style="aspect-ratio:1;width:88%;background:url(\''+d.custom+'\') center/contain no-repeat"></i>';
    else th='<i style="aspect-ratio:'+d.w+'/'+d.h+';background-image:url(\''+GURL+'\');background-size:'+(3312/d.w*100)+'% '+(2480/d.h*100)+'%;background-position:'+(d.x/(3312-d.w)*100)+'% '+(d.y/(2480-d.h)*100)+'%"></i>';
    var ch=function(t,c){return t?String(t).split('/').map(function(x){return x.trim()}).filter(Boolean).map(function(x){return'<span class="chip'+(c?' c2':'')+'">'+esc(fa(x))+'</span>'}).join(''):''};
    return'<article class="card" data-i="'+i+'"><div class="th">'+th+'</div><h3>'+esc(p.t1+' '+p.t2)+'</h3>'+
      '<div class="pr"><small>'+esc(s.lPrice)+'</small><b>'+money(p.price)+'</b><span>'+esc(s.unit)+'</span></div>'+
      '<div class="chips">'+ch(p.sizes.replace(/سال/,''),0)+'</div><div class="chips">'+ch(p.colors,1)+'</div></article>';
  }).join('');
  $$('.card').forEach(function(c){c.onclick=function(){
    var i=+c.dataset.i;window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    setDetail(false);
    setTimeout(function(){var k=(i-cur+N)%N;if(k>0)follow(k)},reduce?0:450);
  }});
  /* scroll spy */
  var secs=ids.map(function(id){return $('#'+id)}),as=$$('#links a');
  window.addEventListener('scroll',function(){
    var y=window.scrollY+window.innerHeight*.4,on=0;
    secs.forEach(function(sc,i){if(sc.offsetTop<=y)on=i});
    as.forEach(function(a,i){a.classList.toggle('on',i===on)});
  },{passive:true});
}

/* ====================== انیمیشن ورود ====================== */
function intro(){
  var root=document.documentElement;
  root.classList.remove('pre');
  if(reduce)return;
  var E='cubic-bezier(.2,.75,.2,1)';
  var A=function(el,kf,dur,delay){if(el&&el.animate)el.animate(kf,{duration:dur,delay:delay,easing:E,fill:'backwards'})};
  A($('#railsvg'),[{opacity:0,clipPath:'inset(-300px 100% -300px -300px)'},{opacity:1,clipPath:'inset(-300px -300px -300px -300px)'}],1000,100);
  A($('#nav'),[{opacity:0},{opacity:1}],900,200);
  els.forEach(function(el,i){A(el,[{opacity:0,translate:'0 -14px'},{opacity:1,translate:'0 0'}],900,250+slotOf(i)*35)});
  $$('#info .ln>span').forEach(function(sp,i){A(sp,[{transform:'translateY(105%)',opacity:0},{transform:'translateY(0)',opacity:1}],1000,650+i*70)});
  ['#idx','.rule','#viewBtn','#pager','#foot','#hint'].forEach(function(s,i){A($(s),[{opacity:0},{opacity:1}],900,900+i*70)});
  if(!document.body.classList.contains('seen'))setTimeout(function(){var el=$('#pieces');if(el&&el.animate)el.animate([{translate:'0 0'},{translate:'-26px 0'},{translate:'0 0'},{translate:'-14px 0'},{translate:'0 0'}],{duration:1500,easing:'ease-in-out'})},1900);
}

/* ====================== راهنما، بازگشت به بالا ====================== */
function seenHint(){
  if(document.body.classList.contains('seen'))return;
  document.body.classList.add('seen');
  try{localStorage.setItem('delband_seen','1')}catch(e){}
}
function onScroll(){
  var y=window.scrollY;
  document.body.classList.toggle('atTop',y<40);
  $('#toTop').classList.toggle('show',y>80);
  if(detail&&!mq.matches&&y>150)setDetail(false);
}
$('#toTop').onclick=function(){setDetail(false);window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})};
/* اصلاح جهت فلش‌های کنار رگال در موبایل */
$('#eL').onclick=next;$('#eR').onclick=prev;
$('#scrim').onclick=function(){setDetail(false)};
window.addEventListener('scroll',onScroll,{passive:true});
try{if(localStorage.getItem('delband_seen'))document.body.classList.add('seen')}catch(e){}
onScroll();

/* ====================== شروع ====================== */
function start(){
  try{var tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();if(tg.BackButton)tg.BackButton.onClick(function(){setDetail(false)})}}catch(e){}
  buildStatic();
  if(!N){$('#info').style.display='none';$('#pager').style.display='none';$('#idx').style.display='none';placeBlocks();sizeAll(true);return}
  build();placeBlocks();sizeAll(true);
  if(window.ResizeObserver)new ResizeObserver(function(){sizeAll(false)}).observe(hero);
  fillText();updIndex();
  layout();
  requestAnimationFrame(function(){requestAnimationFrame(intro)});
  setTimeout(function(){document.documentElement.classList.remove('pre')},4000);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
