<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>دلبند | پوشاک بچه‌گانه</title>
<meta name="description" content="دلبند؛ رگال لباس‌های نرم و پاستلی کودک با قیمت عمده.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>(function(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('pre')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--wall:#ECE6EB;--ink:#32333F;--muted:#6A6B80;--value:#7173A6;--a1:#9D9FE4;--a2:#E9ACA9;--e:cubic-bezier(.2,.75,.2,1);--ns:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{scroll-behavior:smooth}
body{background:var(--wall);color:var(--ink);font-family:'Noto Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.7}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}

/* ---------- nav ---------- */
#nav{position:fixed;top:0;left:0;right:0;height:calc(42px*var(--ns));z-index:900;font-size:calc(12.5px*var(--ns));direction:rtl}
.brand{position:absolute;right:calc(57px*var(--ns));top:calc(3px*var(--ns));font-size:calc(27px*var(--ns));font-weight:300;line-height:1.4}
.links{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px*var(--ns));display:flex;gap:calc(35px*var(--ns));white-space:nowrap}
.links a{position:relative;padding-bottom:2px}
.links a.on::after{content:"";position:absolute;right:0;left:0;bottom:-3px;height:1px;background:var(--ink)}
.navr{position:absolute;left:calc(54px*var(--ns));top:calc(10px*var(--ns));display:flex;align-items:center;gap:calc(30px*var(--ns))}
.navtel{white-space:nowrap}
.menu{display:flex;align-items:center;gap:calc(21px*var(--ns));font-size:inherit}
.burger{width:calc(25px*var(--ns));height:calc(13px*var(--ns));position:relative;display:block}
.burger i{position:absolute;left:0;right:0;height:1px;background:var(--ink)}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:calc(6px*var(--ns))}.burger i:nth-child(3){top:calc(12px*var(--ns))}
#menuPanel{position:fixed;top:calc(46px*var(--ns));left:calc(40px*var(--ns));z-index:950;background:rgba(246,242,246,.96);border:1px solid rgba(50,51,63,.1);border-radius:14px;padding:10px 6px;min-width:190px;box-shadow:0 12px 40px rgba(60,50,80,.12);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .3s,transform .4s var(--e),visibility 0s .3s;direction:rtl}
#menuPanel.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#menuPanel a{display:block;padding:9px 16px;font-size:14px;border-radius:9px}
#menuPanel a:hover{background:rgba(157,159,228,.18)}

/* ---------- hero ---------- */
.hero{position:relative;height:100vh;height:100dvh;min-height:520px;overflow:hidden;touch-action:pan-y}
.wall{position:absolute;inset:0;background:
radial-gradient(70% 80% at 80% 40%,color-mix(in srgb,var(--wall) 70%,#fff) 0,transparent 70%),
linear-gradient(90deg,color-mix(in srgb,var(--wall) 93%,#3b2f45) 0%,color-mix(in srgb,var(--wall) 97%,#3b2f45) 30%,var(--wall) 60%,color-mix(in srgb,var(--wall) 96%,#fff) 100%)}
#frame{position:absolute;width:1440px;height:900px;transform-origin:0 0;direction:ltr}
#railsvg{position:absolute;left:0;top:0;width:1440px;height:900px;overflow:visible;clip-path:inset(-300px -300px -300px -300px);transition:clip-path .7s cubic-bezier(.65,0,.25,1);pointer-events:none}
body.detail #railsvg{clip-path:inset(-300px 46% -300px -300px)}
#floor{position:absolute;left:52px;width:600px;height:60px;background:radial-gradient(closest-side,rgba(70,60,90,.14),transparent);transition:top .55s var(--e);pointer-events:none}
.piece{position:absolute;left:0;top:0;background-repeat:no-repeat;transition:transform .55s var(--e),opacity .35s ease,filter .55s ease;pointer-events:none;will-change:transform}
#frame.slow .piece{transition:transform .7s cubic-bezier(.65,0,.25,1),opacity .55s ease,filter .55s ease}
#ui{position:absolute;inset:0;z-index:300;pointer-events:none}
.pe,.pe *{pointer-events:auto}

#info{position:absolute;left:1118px;top:198px;width:310px;direction:rtl;text-align:right;transition:transform .75s cubic-bezier(.65,0,.2,1)}
body.detail #info,body.detail #pager{transform:translateX(-328px)}
.ln{display:block;overflow:hidden;padding:2px 0}
.ln>span{display:block}
.sw{transition:opacity .22s ease,transform .32s var(--e)}
.sw.out{opacity:0;transform:translateY(5px)}
.cnt{font-size:12px;color:var(--muted);height:22px;direction:rtl}
.ttl{margin-top:24px;font-size:34px;font-weight:300;line-height:40px;min-height:84px;white-space:nowrap}
.rule{margin-top:34px;width:20px;height:1px;background:var(--muted);opacity:.7}
.desc{margin-top:22px;font-size:14px;line-height:26px;color:var(--muted);width:300px;font-weight:300}
.specs{margin-top:42px;font-size:12.5px;line-height:27px}
.specs li>span{display:flex;gap:8px;align-items:baseline}
.specs b{font-weight:400;width:84px;flex:none}
.specs em{font-style:normal;color:var(--value);flex:1;line-height:24px}
.specs .pr em{color:var(--ink);font-weight:500;font-size:14px}
.specs .pr small{font-size:11px;font-weight:300;color:var(--muted)}
.vbtn{margin-top:42px;display:inline-flex;align-items:center;gap:14px;font-size:13px;padding-bottom:7px;border-bottom:1px solid var(--ink)}
.vbtn svg{width:10px;height:10px;stroke:var(--ink);fill:none;stroke-width:1}

#pager{position:absolute;left:1118px;top:752px;width:270px;display:flex;justify-content:space-between;align-items:center;direction:ltr;transition:transform .75s cubic-bezier(.65,0,.2,1),width .75s cubic-bezier(.65,0,.2,1)}
body.detail #pager{width:596px}
#pager button{width:38px;height:24px;display:flex;align-items:center;justify-content:center}
#pager svg{width:36px;height:12px;stroke:var(--ink);fill:none;stroke-width:1;opacity:.55;transition:opacity .3s}
#pager button:hover svg{opacity:1}
.pcnt{font-size:12px;color:var(--ink)}

#idx{position:absolute;left:40px;top:250px;font-size:11px;color:var(--muted);text-align:center;direction:ltr;width:20px}
#idx .tr{width:1px;height:77px;background:rgba(50,51,63,.18);margin:12px auto 19px;position:relative}
#idx .fl{position:absolute;inset:0;background:var(--ink);transform-origin:top;transition:transform .55s var(--e)}
#foot{position:absolute;left:53px;top:862px;font-size:11.5px;color:var(--muted);direction:rtl;white-space:nowrap}
#foot a{color:var(--ink)}
#hint{position:absolute;left:640px;top:862px;display:flex;align-items:center;font-size:11px;color:var(--muted);direction:rtl;white-space:nowrap}
#hint svg{width:20px;height:10px;margin:0 14px;stroke:var(--muted);fill:none;stroke-width:1}

/* detail panel */
#panel{position:absolute;left:1098px;top:118px;width:292px;height:700px;direction:rtl;text-align:right;opacity:0;visibility:hidden;transform:translateX(46px);pointer-events:none;transition:opacity .45s ease,transform .7s var(--e),visibility 0s .5s}
body.detail #panel{opacity:1;visibility:visible;transform:none;transition-delay:.32s,.32s,0s;pointer-events:auto}
#panel>*{position:absolute}
.pback{top:0;right:22px;display:flex;align-items:center;gap:12px;font-size:11.5px}
.pback svg{width:9px;height:9px;stroke:var(--ink);fill:none;stroke-width:1}
.ptn{top:52px;left:0;right:22px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.ptabs{top:80px;left:0;right:22px;display:flex;border-bottom:1px solid rgba(50,51,63,.14)}
.ptabs button{flex:1;font-size:10.5px;color:var(--muted);padding:6px 0 9px;position:relative}
.ptabs button.on{color:var(--ink)}
.ptabs button.on::after{content:"";position:absolute;left:14px;right:0;bottom:-1px;height:1px;background:var(--ink)}
#imgbox{top:110px;left:0;right:22px;height:470px;background:#F0EAF0;overflow:hidden}
.lay{position:absolute;inset:0;opacity:0;transform:scale(1.03);transition:opacity .45s ease,transform .9s var(--e)}
.lay.on{opacity:1;transform:scale(1)}
.lay .in{position:absolute}
.lay .in.empty{inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.pcap{top:596px;left:0;right:22px;font-size:12.5px;line-height:21px;color:var(--muted)}
.ppr{top:640px;left:0;right:22px;font-size:13px;display:flex;align-items:baseline;gap:8px}
.ppr b{font-weight:400;color:var(--muted);font-size:12px}
.ppr strong{font-weight:500;font-size:16px}
.pcall{top:668px;left:0;right:22px;font-size:12.5px;color:var(--value);display:flex;gap:8px;align-items:center}
.ptrack{top:80px;right:0;width:1px;height:520px;background:rgba(50,51,63,.12)}
.ptrack i{position:absolute;right:-1px;top:0;width:3px;height:120px;border-radius:2px;background:rgba(50,51,63,.45);transition:top .5s var(--e)}

/* ---------- sections ---------- */
section.sec{padding:96px 8vw;position:relative}
.sec h2{font-size:30px;font-weight:300;line-height:1.5}
.sec .sub{margin-top:10px;color:var(--muted);font-size:15px;font-weight:300;max-width:640px}
.sec .rule2{width:24px;height:1px;background:var(--muted);opacity:.7;margin:22px 0 0}
#price{background:linear-gradient(180deg,var(--wall),color-mix(in srgb,var(--wall) 92%,#fff))}
.grid{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:20px}
.card{background:rgba(255,255,255,.5);border:1px solid rgba(50,51,63,.07);border-radius:18px;padding:14px 14px 18px;cursor:pointer;transition:transform .5s var(--e),box-shadow .5s,background .4s}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.8);box-shadow:0 18px 40px rgba(80,70,110,.1)}
.th{height:236px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(240,234,240,.7));border-radius:12px}
.th i{display:block;height:88%;background-repeat:no-repeat}
.card h3{margin-top:14px;font-size:16px;font-weight:400}
.card .pr{margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .pr small{font-size:11.5px;color:var(--muted)}
.card .pr b{font-size:19px;font-weight:500}
.card .pr span{font-size:12px;color:var(--muted)}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 11px;border-radius:99px;border:1px solid color-mix(in srgb,var(--a1) 60%,transparent);background:color-mix(in srgb,var(--a1) 12%,transparent);color:var(--ink)}
.chip.c2{border-color:color-mix(in srgb,var(--a2) 70%,transparent);background:color-mix(in srgb,var(--a2) 16%,transparent)}
.feats{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.feat{padding:26px 24px;border-radius:18px;background:rgba(255,255,255,.45);border:1px solid rgba(50,51,63,.07)}
.feat i{display:block;width:12px;height:12px;border-radius:50%;background:var(--a1);margin-bottom:16px}
.feat:nth-child(2) i{background:var(--a2)}
.feat h3{font-size:17px;font-weight:400}
.feat p{margin-top:6px;color:var(--muted);font-size:14px;font-weight:300}
#contact{background:color-mix(in srgb,var(--wall) 90%,#3b2f45);text-align:center}
#contact .sub{margin-inline:auto}
.bigtel{display:inline-block;margin-top:30px;font-size:clamp(28px,5vw,46px);font-weight:300;letter-spacing:.04em;direction:ltr;border-bottom:1px solid var(--ink);padding-bottom:6px}
.crow{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:99px;border:1px solid var(--ink);font-size:14px;transition:background .3s,color .3s}
.btn:hover,.btn.fill{background:var(--ink);color:#fff}
.btn.fill:hover{background:var(--value);border-color:var(--value)}
.cinfo{margin-top:26px;color:var(--muted);font-size:14px;line-height:2}
footer.fo{padding:26px 8vw 96px;text-align:center;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--wall) 90%,#3b2f45)}
footer.fo a{color:var(--ink);border-bottom:1px solid rgba(50,51,63,.3)}

.fab{position:fixed;right:18px;bottom:18px;z-index:960;display:flex;align-items:center;gap:10px;height:50px;padding:0 20px 0 22px;border-radius:25px;background:var(--ink);color:#fff;font-size:15px;box-shadow:0 10px 30px rgba(50,51,63,.28);transition:transform .4s var(--e),background .3s;direction:rtl}
.fab:hover{transform:translateY(-3px);background:var(--value)}
.fab svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fab bdi{letter-spacing:.04em}

/* intro hide */
html.pre .piece,html.pre #railsvg,html.pre #nav,html.pre .fade0{opacity:0!important}
html.pre .ln>span{transform:translateY(105%);opacity:0}

/* ---------- gallery / extras ---------- */
#track{display:flex;width:100%;height:100%;direction:ltr;transition:transform .5s var(--e)}
.sl{flex:0 0 100%;position:relative;height:100%;overflow:hidden}
.sl .in{position:absolute}
.sl .in.empty{inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
#imgbox{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.72);font-size:20px;line-height:28px;z-index:3}
.gP{left:8px}.gN{right:8px}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:7px;z-index:3;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(50,51,63,.28);transition:all .3s}
.dots i.on{background:var(--ink);width:16px;border-radius:3px}
.ptitle,.pspecs{display:none}
.totop{position:fixed;left:18px;bottom:18px;z-index:955;display:flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;background:rgba(255,255,255,.9);border:1px solid rgba(50,51,63,.15);box-shadow:0 8px 24px rgba(50,51,63,.15);font-size:14px;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .35s,transform .45s var(--e),visibility 0s .35s;direction:rtl}
.totop.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.totop svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.6}
.edge,.swhint,.mcall,#scrim{display:none}
.screen{display:block}
.mi{display:none}
@keyframes edgep{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--d,6px))}}
@keyframes swh{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}

/* ---------- mobile ---------- */
@media (max-width:820px){
 .screen{height:100vh;height:100dvh;min-height:560px;display:flex;flex-direction:column}
 .hero{flex:1 1 auto;height:auto;min-height:0}
 #nav{position:absolute;height:52px;--ns:1}
 .brand{right:18px;top:8px;font-size:23px}
 .links,.navtel{display:none}
 .navr{left:18px;top:14px}
 #menuPanel{position:absolute;top:50px;left:14px}
 #idx,#foot,#hint{display:none}

 .mi{display:grid;flex:none;min-height:258px;align-content:start;grid-template-columns:auto 1fr auto;grid-template-areas:"ttl ttl cnt" "spc spc spc" "dsc dsc dsc" "call btn pgr";gap:8px 10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:rgba(247,243,247,.94);border-top:1px solid rgba(50,51,63,.08);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(80,70,110,.08);position:relative}
 .mi #info{display:contents}
 .mi .rule{display:none}
 .mi .ttl{grid-area:ttl;display:flex;gap:.35em;min-height:0;margin:0;font-size:25px;line-height:34px}
 .mi .cnt{grid-area:cnt;height:auto;align-self:center;font-size:12px}
 .mi .specs{grid-area:spc;margin:0;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:6px 12px;font-size:12.5px;line-height:20px}
 .mi .specs li.pr{grid-column:1/-1}
 .mi .specs li>span{display:block}
 .mi .specs b{display:block;width:auto;font-size:10.5px;color:var(--muted);line-height:16px}
 .mi .specs em{display:block;line-height:19px}
 .mi .specs .pr>span{display:flex;align-items:baseline;gap:10px}
 .mi .specs .pr b{display:inline;font-size:12px}
 .mi .specs .pr em{font-size:21px;line-height:30px}
 .mi .specs .pr em small{font-size:12px}
 .mi .desc{grid-area:dsc;margin:0;width:auto;font-size:12.5px;line-height:19px}
 .mi .vbtn{grid-area:btn;margin:0;justify-content:center;height:44px;border-radius:99px;background:var(--ink);color:#fff;border:0;padding:0 12px;font-size:14px}
 .mi .vbtn svg{stroke:#fff}
 .mi .mcall{grid-area:call;display:flex;width:44px;height:44px;border-radius:50%;border:1px solid rgba(50,51,63,.25);align-items:center;justify-content:center}
 .mi .mcall svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
 .mi #pager{grid-area:pgr;position:static;width:auto!important;transform:none!important;margin:0;gap:0}
 .mi #pager button{width:38px;height:44px}
 .mi #pager svg{opacity:.8}

 .edge{display:flex;position:absolute;top:42%;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;background:rgba(255,255,255,.6);font-size:24px;line-height:1;color:var(--ink);z-index:400;opacity:.9;animation:edgep 1.8s ease-in-out infinite}
 .eL{left:8px;--d:-6px}.eR{right:8px;--d:6px}
 body.seen .edge{animation:none;opacity:.55}
 .swhint{display:flex;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:400;padding:6px 16px;border-radius:99px;background:rgba(50,51,63,.84);color:#fff;font-size:12.5px;gap:10px;align-items:center;white-space:nowrap;pointer-events:none;transition:opacity .5s,visibility .5s}
 .swhint i{font-style:normal;font-size:16px;display:inline-block;animation:swh 1.4s ease-in-out infinite}
 .swhint i:last-child{animation-direction:reverse}
 body.seen .swhint{opacity:0;visibility:hidden}

 #scrim{display:block;position:fixed;inset:0;background:rgba(50,51,63,.4);z-index:965;opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
 body.detail #scrim{opacity:1;visibility:visible;transition-delay:0s}
 body.detail{overflow:hidden}
 .mi #panel{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;max-height:94vh;max-height:94dvh;overflow-y:auto;background:#F4F0F4;border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));z-index:970;opacity:1;visibility:hidden;transform:translateY(105%);pointer-events:none;transition:transform .55s var(--e),visibility 0s .55s;box-shadow:0 -16px 50px rgba(40,30,60,.25)}
 body.detail .mi #panel{visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
 .mi #panel>*{position:static}
 .mi .pback{display:flex;margin:0 0 6px;font-size:13px;padding:4px 0}
 .mi .ptitle{display:block;font-size:21px;font-weight:300;line-height:32px;margin-bottom:6px}
 .mi .ptn{display:none}
 .mi .ptabs{display:flex;margin-bottom:10px}
 .mi #panel #imgbox{position:relative;top:auto;left:auto;right:auto;height:min(50vh,calc((100vw - 36px)*1.2));height:min(50dvh,calc((100vw - 36px)*1.2))}
 .mi .pcap{margin-top:10px;font-size:12.5px;line-height:19px}
 .mi .ppr{display:flex;margin-top:10px}
 .mi .pspecs{display:block;margin-top:4px;font-size:12.5px;color:var(--muted);line-height:21px}
 .mi .pcall{display:flex;margin-top:6px}
 .mi .ptrack{display:none}

 body.atTop .fab{opacity:0;pointer-events:none;transform:translateY(16px)}
 .fab{height:46px;font-size:14px;padding:0 16px;transition:transform .4s var(--e),background .3s,opacity .3s}
 section.sec{padding:64px 22px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .th{height:170px}
 .card h3{font-size:14px}.card .pr b{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<nav id="nav">
  <a class="brand" href="#hero" id="brand"></a>
  <div class="links" id="links"></div>

}

/* ====================== هاور و کلیک ====================== */
function toFrame(e){var r=frame.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function span(s){
  var i=(cur+s)%N,d=defs[i],X=hookX(s),S=scaleAt(X,s),top=railY(X)-9*S;
  return{l:X-d.lo*S,r:X+(d.w-d.lo)*S,t:top,b:top+d.h*S};
}
function hit(x,y){
  if(!N)return-1;
  var f=span(0);
  if(x>f.l+30&&x<f.r-20&&y>f.t+60&&y<f.b)return 0;
  if(detail)return-1;
  for(var s=1;s<N;s++){
    var a=span(s);
    if(a.r-6>=x){
      if(y>a.t+40&&y<a.b-10&&x>f.r-20)return s;
      return-1;
    }
  }
  return-1;
}
function setHover(h){
  var hv=h>0?h:-1;
  if(hv!==hover){hover=hv;layout()}
  hero.style.cursor=h>=0?'pointer':'';
}
hero.addEventListener('mousemove',function(e){
  if(!hasHover||detail||following||mq.matches)return;
  if(e.target.closest('.pe')){setHover(-1);return}
  var f=toFrame(e);setHover(hit(f.x,f.y));
});
hero.addEventListener('mouseleave',function(){if(!following)setHover(-1)});
hero.addEventListener('click',function(e){
  if(e.target.closest('.pe'))return;
  if(following)return;
  var f=toFrame(e),h=hit(f.x,f.y);
  if(h===0)setDetail(!detail);
  else if(h>0&&!detail)follow(h);
});

/* چرخ، کلید، لمس */
var acc=0;
hero.addEventListener('wheel',function(e){
  if(mq.matches||window.scrollY>8||!N)return;
  if(e.target.closest('#panel'))return;
  var f=toFrame(e);
  if(f.x>1090&&!detail)return;           /* روی ستون اطلاعات، صفحه عادی اسکرول می‌شود */
  e.preventDefault();
  acc+=e.deltaY+e.deltaX;
  while(acc>=40){acc-=40;next()}
  while(acc<=-40){acc+=40;prev()}
},{passive:false});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key==='Escape'){setDetail(false);closeMenu()}
});
var tx=0,ty=0;
hero.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
hero.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>36&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev()}
},{passive:true});
$('#nextBtn').onclick=next;$('#prevBtn').onclick=prev;

/* ====================== نمای جزئیات ====================== */
var slowT;
function setDetail(on){
  if(on===detail||!N)return;
  detail=on;document.body.classList.toggle('detail',on);
  frame.classList.add('slow');clearTimeout(slowT);slowT=setTimeout(function(){frame.classList.remove('slow')},760);
  hover=-1;hero.style.cursor='';
  if(on){si=0;renderPanel()}
  try{var tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.BackButton&&mq.matches){on?tg.BackButton.show():tg.BackButton.hide()}}catch(e){}
  layout();
}
$('#viewBtn').onclick=function(){setDetail(true)};
$('#backBtn').onclick=function(){setDetail(false)};

var box=$('#imgbox'),track=$('#track'),si=0,slides=[];
function reset(inn){inn.removeAttribute('style');inn.className='in';inn.textContent=''}
function empty(inn){inn.className='in empty';inn.textContent='تصویری ثبت نشده'}
function contain(inn,url){inn.style.cssText='left:0;top:0;width:100%;height:100%;background:url("'+url+'") center/contain no-repeat'}
function cover(inn,url,sw,sh,ix,iy,iw,ih,bw,bh){
  var s=Math.max(bw/iw,bh/ih);
  inn.style.cssText='left:0;top:0;width:'+bw+'px;height:'+bh+'px;background:url("'+url+'") no-repeat;background-size:'+(sw*s)+'px '+(sh*s)+'px;background-position:'+(bw/2-(ix+iw/2)*s)+'px '+(bh/2-(iy+ih/2)*s)+'px';
}
function buildLayers(){
  var bw=box.clientWidth,bh=box.clientHeight;if(!bw||!bh)return;
  var p=P[cur],im=p.images||{},k=p.sprite;
  slides=[{},{},{}];(p.gallery||[]).forEach(function(u){slides.push({u:u})});
  track.innerHTML=slides.map(function(){return'<div class="sl"><div class="in"></div></div>'}).join('');
  var inn=$$('.sl .in',track);
  if(im.hanger)contain(inn[0],im.hanger);
  else if(k===1){
    var s=bw/990,h=1007*s;
    inn[0].style.cssText='left:0;top:'+((bh-h)/2)+'px;width:'+bw+'px;height:'+h+'px;background:url("'+D1URL+'") no-repeat;background-size:'+(2048*s)+'px '+(2048*s)+'px;background-position:'+(bw/2-503.5*s)+'px 0px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent)';
  }else if(k>=2&&k<=12){
    var d=SPR[k-1],w=d[2],hh=d[3],sc=Math.min(.9*bw/w,.88*bh/hh);
    inn[0].style.cssText='left:'+((bw-w*sc)/2)+'px;top:'+((bh-hh*sc)/2)+'px;width:'+w+'px;height:'+hh+'px;transform-origin:0 0;transform:scale('+sc+');background:url("'+GURL+'") no-repeat;background-size:3312px 2480px;background-position:'+(-d[0])+'px '+(-d[1])+'px';
  }else empty(inn[0]);
  [['fabric',1,0,1041,FURL,FX,FW,FY,FH],['detail',2,1041,0,TURL,TX,TW,TY,TH]].forEach(function(c){
    var t=inn[c[1]];
    if(im[c[0]]){t.style.cssText='left:0;top:0;width:100%;height:100%;background:url("'+im[c[0]]+'") center/cover no-repeat'}
    else if(k===1)cover(t,D1URL,2048,2048,c[2]+6,c[3]+6,995,995,bw,bh);
    else if(k>=2&&k<=12){var col=(k-1)%4,row=Math.floor((k-1)/4);cover(t,c[4],3312,2480,c[5][col]+6,c[7][row]+6,c[6][col]-12,c[8][row]-12,bw,bh)}
    else empty(t);
  });
  slides.forEach(function(sl,i){if(sl.u)inn[i].style.cssText='left:0;top:0;width:100%;height:100%;background:url("'+sl.u+'") center/cover no-repeat'});
}
function showSlide(anim){
  var n=slides.length;if(!n)return;
  track.style.transition=anim===false?'none':'';
  track.style.transform='translateX('+(-si*100)+'%)';
  $$('#ptabs button').forEach(function(b,i){b.classList.toggle('on',i===si)});
  $('#dots').innerHTML=slides.map(function(_,i){return'<i'+(i===si?' class="on"':'')+'></i>'}).join('');
  $('#ptName').textContent=SITE.tabs[si]||('عکس '+fa(si+1));
  $('#ptNum').textContent=pad(si+1)+' / '+pad(n);
  $('#pcap').textContent=SITE.caps[si]||'';
  $('#pthumb').style.top=(n>1?si/(n-1)*400:0)+'px';
}
function goSlide(i){var n=slides.length;si=((i%n)+n)%n;showSlide(true)}
function renderPanel(){
  var p=P[cur];
  buildLayers();
  if(si>=slides.length)si=0;
  $('#ptabs').innerHTML=slides.map(function(_,i){return'<button>'+pad(i+1)+' / '+esc(SITE.tabs[i]||('عکس '+fa(i+1)))+'</button>'}).join('');
  $$('#ptabs button').forEach(function(b,i){b.onclick=function(){goSlide(i)}});
  $('#ptitle').textContent=(p.t1||'')+' '+(p.t2||'');
  $('#pspecs').textContent=SITE.lSize+': '+fa(p.sizes)+' · '+SITE.lColor+': '+fa(p.colors)+' · '+SITE.lMat+': '+fa(p.material);
  $('#ppL').textContent=SITE.lPrice+':';$('#ppV').textContent=money(p.price);$('#ppU').textContent=SITE.unit;
  showSlide(false);
}
$('#gP').onclick=function(){goSlide(si-1)};$('#gN').onclick=function(){goSlide(si+1)};
var drag=null;
box.addEventListener('pointerdown',function(e){if(e.target.closest('.gnav'))return;drag={x:e.clientX,y:e.clientY,dx:0,mv:false,k:box.getBoundingClientRect().width/(box.clientWidth||1)}});
box.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.mv){if(Math.abs(dx)<6)return;if(Math.abs(dy)>Math.abs(dx)){drag=null;return}drag.mv=true;try{box.setPointerCapture(e.pointerId)}catch(_){}track.style.transition='none'}
  drag.dx=dx;track.style.transform='translateX(calc('+(-si*100)+'% + '+(dx/drag.k)+'px))';
});
function endDrag(){
  if(!drag)return;var d=drag;drag=null;
  if(!d.mv)return;
  if(d.dx<-40)goSlide(si+1);else if(d.dx>40)goSlide(si-1);else showSlide(true);
}
box.addEventListener('pointerup',endDrag);box.addEventListener('pointercancel',endDrag);

/* ====================== اندازه و چیدمان ====================== */
var ui=$('#ui'),mi=$('#mi'),movers=[$('#info'),$('#pager'),$('#panel')];
function placeBlocks(){movers.forEach(function(m){(mq.matches?mi:ui).appendChild(m)})}
function sizeAll(){
  var vw=hero.clientWidth,vh=hero.clientHeight;
  document.documentElement.style.setProperty('--ns',mq.matches?1:Math.max(.62,Math.min(1,window.innerWidth/1440)));
  if(!mq.matches){
    scale=Math.min(Math.max(vw/1440,vh/900),vh/870,vw/1380);
    frame.style.left='50%';frame.style.top='50%';
    frame.style.transform='translate('+(-720*scale)+'px,'+(-450*scale)+'px) scale('+scale+')';
  }else{
    scale=(vh-36)/780;
    var x=Math.min(0,Math.max(vw-1100*scale,(vw-760*scale)/2-40*scale)),y=-vh/2-20*scale+40;
    frame.style.left='0';frame.style.top='50%';
    frame.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')';
  }
}
function onResize(){placeBlocks();sizeAll();layout();if(detail)buildLayers()}
window.addEventListener('resize',onResize);

/* ====================== منو و تماس ====================== */
var menu=$('#menuPanel');
function closeMenu(){menu.classList.remove('open')}
$('#menuBtn').onclick=function(e){e.stopPropagation();menu.classList.toggle('open')};
document.addEventListener('click',function(e){if(!e.target.closest('#menuPanel'))closeMenu()});

function buildStatic(){
  var s=SITE,tel=phoneTel(s.phone),show=phoneShow(s.phone);
  $('#brand').textContent=s.brand;
  var ids=['hero','price','about','contact'];
  $('#links').innerHTML=s.nav.map(function(l,i){return'<a href="#'+ids[i]+'" data-s="'+ids[i]+'"'+(i===0?' class="on"':'')+'>'+esc(l)+'</a>'}).join('');
  menu.innerHTML=s.nav.map(function(l,i){return'<a href="#'+ids[i]+'">'+esc(l)+'</a>'}).join('')+'<a href="'+tel+'">☎ <bdi dir="ltr">'+show+'</bdi></a>';
  $$('bdi',$('#navtel')).forEach(function(b){b.textContent=show});$('#navtel').href=tel;
  $('#hint1').textContent=s.hint1;$('#hint2').textContent=s.hint2;
  $('#viewTxt').textContent=s.viewBtn;$('#backTxt').textContent=s.back;
  $('#lPrice').textContent=s.lPrice;$('#lSize').textContent=s.lSize;$('#lColor').textContent=s.lColor;$('#lMat').textContent=s.lMat;$('#unit').textContent=s.unit;
  $('#footTag').textContent=s.footTag;$('#footTel bdi').textContent=show;$('#footTel').href=tel;
  $('#pcall bdi').textContent=show;$('#pcall').href=tel;
  $('#iAll').textContent=pad(N);
  $('#priceT').textContent=s.priceTitle;$('#priceS').textContent=s.priceSub;
  $('#aboutT').textContent=s.aboutTitle;$('#aboutX').textContent=s.aboutText;
  $('#feats').innerHTML=(s.features||[]).map(function(f){return'<div class="feat"><i></i><h3>'+esc(f.t)+'</h3><p>'+esc(f.x)+'</p></div>'}).join('');
  $('#contactT').textContent=s.contactTitle;$('#contactX').textContent=s.contactText;
  $('#bigtel bdi').textContent=show;$('#bigtel').href=tel;$('#callBtn').href=tel;
  var tg=String(s.telegram||'').replace(/^@/,'').trim();
  if(tg){var b=$('#tgBtn');b.hidden=false;b.href='https://t.me/'+encodeURIComponent(tg)}
  var ci=[];if(s.address)ci.push(esc(fa(s.address)));if(s.hours)ci.push(esc(fa(s.hours)));
  $('#cinfo').innerHTML=ci.join('<br>');
  $('#fo').innerHTML=esc(s.footerText)+'<br>تماس: <a href="'+tel+'"><bdi dir="ltr">'+show+'</bdi></a>';
  $('#fab').href=tel;$('#fabTxt').textContent=show;$('#mcall').href=tel;
  $('#copyBtn').onclick=function(){
    var t=String(s.phone),b=this,done=function(){b.textContent='کپی شد ✓';setTimeout(function(){b.textContent='کپی شماره'},1800)};
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,done);else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}
  };
  /* لیست قیمت */
  $('#grid').innerHTML=P.map(function(p,i){
    var d=defs[i],th;
    if(d.custom)th='<i style="aspect-ratio:1;width:88%;background:url(\''+d.custom+'\') center/contain no-repeat"></i>';
    else th='<i style="aspect-ratio:'+d.w+'/'+d.h+';background-image:url(\''+GURL+'\');background-size:'+(3312/d.w*100)+'% '+(2480/d.h*100)+'%;background-position:'+(d.x/(3312-d.w)*100)+'% '+(d.y/(2480-d.h)*100)+'%"></i>';
    var ch=function(t,c){return t?String(t).split('/').map(function(x){return x.trim()}).filter(Boolean).map(function(x){return'<span class="chip'+(c?' c2':'')+'">'+esc(fa(x))+'</span>'}).join(''):''};
    return'<article class="card" data-i="'+i+'"><div class="th">'+th+'</div><h3>'+esc(p.t1+' '+p.t2)+'</h3>'+
      '<div class="pr"><small>'+esc(s.lPrice)+'</small><b>'+money(p.price)+'</b><span>'+esc(s.unit)+'</span></div>'+
      '<div class="chips">'+ch(p.sizes.replace(/سال/,''),0)+'</div><div class="chips">'+ch(p.colors,1)+'</div></article>';
  }).join('');
  $$('.card').forEach(function(c){c.onclick=function(){
    var i=+c.dataset.i;window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    setDetail(false);
    setTimeout(function(){var k=(i-cur+N)%N;if(k>0)follow(k)},reduce?0:450);
  }});
  /* scroll spy */
  var secs=ids.map(function(id){return $('#'+id)}),as=$$('#links a');
  window.addEventListener('scroll',function(){
    var y=window.scrollY+window.innerHeight*.4,on=0;
    secs.forEach(function(sc,i){if(sc.offsetTop<=y)on=i});
    as.forEach(function(a,i){a.classList.toggle('on',i===on)});
  },{passive:true});
}

/* ====================== انیمیشن ورود ====================== */
function intro(){
  var root=document.documentElement;
  root.classList.remove('pre');
  if(reduce)return;
  var E='cubic-bezier(.2,.75,.2,1)';
  var A=function(el,kf,dur,delay){if(el&&el.animate)el.animate(kf,{duration:dur,delay:delay,easing:E,fill:'backwards'})};
  A($('#railsvg'),[{opacity:0,clipPath:'inset(-300px 100% -300px -300px)'},{opacity:1,clipPath:'inset(-300px -300px -300px -300px)'}],1000,100);
  A($('#nav'),[{opacity:0},{opacity:1}],900,200);
  els.forEach(function(el,i){A(el,[{opacity:0,translate:'0 -14px'},{opacity:1,translate:'0 0'}],900,250+slotOf(i)*35)});
  $$('#info .ln>span').forEach(function(sp,i){A(sp,[{transform:'translateY(105%)',opacity:0},{transform:'translateY(0)',opacity:1}],1000,650+i*70)});
  ['#idx','.rule','#viewBtn','#pager','#foot','#hint'].forEach(function(s,i){A($(s),[{opacity:0},{opacity:1}],900,900+i*70)});
  if(!document.body.classList.contains('seen'))setTimeout(function(){var el=$('#pieces');if(el&&el.animate)el.animate([{translate:'0 0'},{translate:'-26px 0'},{translate:'0 0'},{translate:'-14px 0'},{translate:'0 0'}],{duration:1500,easing:'ease-in-out'})},1900);
}

/* ====================== راهنما، بازگشت به بالا ====================== */
function seenHint(){
  if(document.body.classList.contains('seen'))return;
  document.body.classList.add('seen');
  try{localStorage.setItem('delband_seen','1')}catch(e){}
}
function onScroll(){
  var y=window.scrollY;
  document.body.classList.toggle('atTop',y<40);
  $('#toTop').classList.toggle('show',y>80);
  if(detail&&!mq.matches&&y>150)setDetail(false);
}
$('#toTop').onclick=function(){setDetail(false);window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})};
$('#eL').onclick=prev;$('#eR').onclick=next;
$('#scrim').onclick=function(){setDetail(false)};
window.addEventListener('scroll',onScroll,{passive:true});
try{if(localStorage.getItem('delband_seen'))document.body.classList.add('seen')}catch(e){}
onScroll();

/* ====================== شروع ====================== */
function start(){
  try{var tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();if(tg.BackButton)tg.BackButton.onClick(function(){setDetail(false)})}}catch(e){}
  buildStatic();
  if(!N){$('#info').style.display='none';$('#pager').style.display='none';$('#idx').style.display='none';placeBlocks();sizeAll();return}
  build();placeBlocks();sizeAll();
  if(window.ResizeObserver)new ResizeObserver(function(){sizeAll()}).observe(hero);
  fillText();updIndex();
  layout();
  requestAnimationFrame(function(){requestAnimationFrame(intro)});
  setTimeout(function(){document.documentElement.classList.remove('pre')},4000);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
