<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>دلبند | پوشاک بچه‌گانه</title>
<meta name="description" content="دلبند؛ رگال لباس‌ها و شلوارهای نرم و پاستلی کودک با قیمت عمده.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>(function(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('pre')})()</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Light.woff2') format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
:root{
  --wall:#ECE6EB;
  --ink:#2F2B30;
  --muted:#6E6770;
  --value:#558E97;
  --brand:#67A6B0;
  --a1:#9D9FE4;
  --a2:#E9ACA9;
  --paper:#FAF8F6;
  --line:#E5DFE3;
  --disc:#EF394E;
  --e:cubic-bezier(.2,.75,.2,1);
  --ns:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{scroll-behavior:smooth}
body{background:var(--wall);color:var(--ink);font-family:'YekanBakh','Yekan Bakh',Tahoma,'Segoe UI',system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.7}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}
[hidden]{display:none!important}

/* ---------- nav ---------- */
#nav{position:fixed;top:0;left:0;right:0;height:68px;z-index:900;background:#fff;border-bottom:1px solid #e6e2e5;box-shadow:0 2px 8px rgba(47,43,48,.04);display:flex;align-items:center;justify-content:space-between;padding:0 28px;direction:rtl;font-size:14px}
.nav-right{display:flex;align-items:center;gap:30px;height:100%;min-width:0}
.brand{display:flex;align-items:center;height:46px;font-size:26px;font-weight:700;color:var(--ink);flex:none}
.brand img{height:100%;width:auto;display:block;object-fit:contain}
.links{display:flex;align-items:center;gap:4px;height:100%;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{position:relative;display:flex;align-items:center;height:100%;padding:0 13px;font-weight:500;color:#68626A;transition:color .2s}
.links a:hover{color:var(--ink)}
.links a::after{content:"";position:absolute;right:10px;left:10px;bottom:0;height:2.5px;border-radius:3px 3px 0 0;background:var(--brand);transform:scaleX(0);transition:transform .25s var(--e)}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.links a.on{color:var(--ink);font-weight:700}
.navr{display:flex;align-items:center;gap:12px;flex:none}
.navtel{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:8px;border:1px solid #e2dde1;background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;transition:border-color .2s,background .2s}
.navtel:hover{border-color:var(--brand);background:#fff}
.navtel svg{width:16px;height:16px;fill:none;stroke:var(--value);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-sep{width:1px;height:22px;background:#e4dfe3}
.menu{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:8px;border:1px solid #e2dde1;background:#fff;color:var(--ink);font-size:13.5px;font-weight:500;transition:background .2s,border-color .2s}
.menu:hover{background:var(--paper);border-color:#cfc8cd}
.burger{width:18px;height:12px;position:relative;display:block}
.burger i{position:absolute;left:0;right:0;height:1.8px;border-radius:1px;background:var(--ink)}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:5px}.burger i:nth-child(3){top:10px}
#menuPanel{position:fixed;top:74px;left:28px;z-index:950;background:#fff;border:1px solid #e4dfe3;border-radius:12px;padding:8px;min-width:200px;box-shadow:0 12px 32px rgba(47,43,48,.1);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .35s var(--e),visibility 0s .25s;direction:rtl}
#menuPanel.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#menuPanel a{display:block;padding:10px 14px;font-size:14.5px;font-weight:500;border-radius:8px;color:var(--ink)}
#menuPanel a:hover{background:var(--paper);color:var(--value)}

#mainSections{padding-top:68px}

/* ---------- rack screens ---------- */
.screen{display:block;position:relative;z-index:1;border-bottom:1px solid rgba(47,43,48,.07)}
.hero{position:relative;height:calc(100vh - 68px);height:calc(100svh - 68px);min-height:500px;overflow:hidden;touch-action:pan-y}
.wall{position:absolute;inset:0;background:
radial-gradient(70% 80% at 80% 40%,color-mix(in srgb,var(--rw,var(--wall)) 70%,#fff) 0,transparent 70%),
linear-gradient(90deg,color-mix(in srgb,var(--rw,var(--wall)) 93%,#3b2f45) 0%,color-mix(in srgb,var(--rw,var(--wall)) 97%,#3b2f45) 30%,var(--rw,var(--wall)) 60%,color-mix(in srgb,var(--rw,var(--wall)) 96%,#fff) 100%)}
.rack-badge{position:absolute;right:28px;top:20px;z-index:350;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9px;background:rgba(255,255,255,.82);border:1px solid #E2DCE0;font-size:13.5px;font-weight:700;color:var(--ink);pointer-events:none}
.rack-badge i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.frame{position:absolute;width:1440px;height:900px;transform-origin:0 0;direction:ltr}
.railsvg{position:absolute;left:0;top:0;width:1440px;height:900px;overflow:visible;clip-path:inset(-300px -300px -300px -300px);transition:clip-path .7s cubic-bezier(.65,0,.25,1);pointer-events:none}
.screen.is-detail .railsvg{clip-path:inset(-300px 46% -300px -300px)}
.floor{position:absolute;left:52px;width:600px;height:60px;background:radial-gradient(closest-side,rgba(70,60,90,.14),transparent);transition:top .55s var(--e);pointer-events:none}
.piece{position:absolute;left:0;top:0;background-repeat:no-repeat;transition:transform .55s var(--e),opacity .35s ease,filter .55s ease;pointer-events:none;will-change:transform}
.frame.slow .piece{transition:transform .7s cubic-bezier(.65,0,.25,1),opacity .55s ease,filter .55s ease}
.ui{position:absolute;inset:0;z-index:300;pointer-events:none}
.pe,.pe *{pointer-events:auto}

.rdisc{
  position:absolute;left:210px;top:125px;z-index:260;
  display:inline-flex;align-items:center;justify-content:center;
  padding:5px 14px;border-radius:99px;
  background:var(--disc);color:#fff;font-size:15px;font-weight:700;
  box-shadow:0 8px 20px rgba(239,57,78,.32);
  direction:rtl;pointer-events:none;transition:opacity .3s,transform .3s;
}
.rdisc.hide{opacity:0;transform:scale(.85)}

/* ---------- بخش توضیحات رگال ---------- */
.info{
  position:absolute;left:1076px;top:116px;width:336px;direction:rtl;text-align:right;
  padding:24px 24px 26px;
  background:var(--paper);
  border:1px solid #E3DCE0;
  border-radius:16px;
  box-shadow:0 16px 36px rgba(47,43,48,.07);
  transition:transform .75s cubic-bezier(.65,0,.2,1);
}
.screen.is-detail .info{transform:translateX(-328px)}
.ln{display:block;overflow:hidden;padding:2px 0}
.ln>span{display:block}
.sw{transition:opacity .22s ease,transform .32s var(--e)}
.sw.out{opacity:0;transform:translateY(5px)}

.ttl-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ttl{margin-top:0;min-height:80px;white-space:nowrap;color:var(--ink)}
.ttl .ln:first-child{font-size:20px;font-weight:400;line-height:28px;color:var(--value)}
.ttl .ln:last-child{font-size:36px;font-weight:700;line-height:46px;color:var(--ink);margin-top:2px}
.code-pill{display:inline-block;padding:3px 10px;border-radius:7px;background:#EFEAE7;border:1px solid #DFD7D2;font-size:12px;font-weight:700;color:var(--muted);direction:ltr;white-space:nowrap;margin-top:4px}
.rule{margin-top:12px;width:36px;height:2px;background:var(--brand);border-radius:2px}
.desc{margin-top:12px;font-size:14.5px;line-height:25px;color:var(--muted);width:auto;font-weight:400}

.specs{margin-top:16px;font-size:14px}
.specs li{padding:8px 2px;border-bottom:1px dashed #DFD8DC}
.specs li:last-child{border-bottom:0}
.specs li>span{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.specs b{font-weight:400;color:var(--muted);font-size:13.5px;flex:none}
.specs em{font-style:normal;color:var(--ink);font-weight:500;text-align:left;line-height:22px}

.specs li.pr{
  background:#F2ECE7;
  border:1px solid #E4DBD3;
  border-radius:11px;
  padding:10px 14px;
  margin-bottom:8px;
}
.specs .pr b{font-size:13.5px;color:#5A5357;font-weight:500}
.specs .pr em{color:var(--ink);font-weight:700;font-size:21px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.specs .pr .oldp{font-size:13px;font-weight:400;color:var(--muted);text-decoration:line-through;display:inline-flex;align-items:center;gap:6px}
.specs .pr .dpct{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--disc);color:#fff;font-size:11.5px;font-weight:700;text-decoration:none}
.specs .pr small{font-size:12.5px;font-weight:500;color:var(--muted);margin-right:3px}

.vbtn{
  margin-top:18px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:45px;border-radius:10px;background:var(--ink);color:#fff;
  font-size:15px;font-weight:500;transition:background .25s,transform .2s;
}
.vbtn:hover{background:var(--value);transform:translateY(-1px)}
.vbtn svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:1.7}

.pager{position:absolute;left:282px;top:768px;width:140px;display:flex;justify-content:space-between;align-items:center;direction:ltr}
.pager button{width:54px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid #DFD8DC;background:var(--paper);box-shadow:0 4px 12px rgba(47,43,48,.06);transition:background .2s,border-color .2s,transform .2s}
.pager button:hover{background:#fff;border-color:var(--brand);transform:translateY(-1px)}
.pager svg{width:26px;height:12px;stroke:var(--ink);fill:none;stroke-width:1.5;opacity:.8}
.pager button:hover svg{opacity:1;stroke:var(--value)}

.idx{position:absolute;left:40px;top:250px;font-size:12px;font-weight:500;color:var(--muted);text-align:center;direction:ltr;width:24px}
.idx .tr{width:1.5px;height:77px;background:rgba(47,43,48,.16);margin:12px auto 19px;position:relative}
.idx .fl{position:absolute;inset:0;background:var(--brand);transform-origin:top;transition:transform .55s var(--e)}
.foot{position:absolute;left:53px;top:858px;font-size:12.5px;color:var(--muted);direction:rtl;white-space:nowrap}
.foot a{color:var(--ink);font-weight:500}
.hint{position:absolute;left:640px;top:858px;display:flex;align-items:center;font-size:12px;color:var(--muted);direction:rtl;white-space:nowrap}
.hint svg{width:20px;height:10px;margin:0 14px;stroke:var(--muted);fill:none;stroke-width:1.2}

/* detail panel */
.panel{position:absolute;left:1098px;top:125px;width:292px;height:590px;direction:rtl;text-align:right;opacity:0;visibility:hidden;transform:translateX(46px);pointer-events:none;transition:opacity .45s ease,transform .7s var(--e),visibility 0s .5s}
.screen.is-detail .panel{opacity:1;visibility:visible;transform:none;transition-delay:.32s,.32s,0s;pointer-events:auto}
.panel>*{position:absolute}
.pback{top:0;right:0;display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:8px;background:#fff;border:1px solid #DFD8DC;font-size:13.5px;font-weight:500;color:var(--ink);transition:background .2s,border-color .2s}
.pback:hover{background:var(--paper);border-color:var(--brand)}
.pback svg{width:11px;height:11px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.ptabs{top:52px;left:0;right:0;display:flex;border-bottom:1px solid #E2DCE0}
.ptabs button{flex:1;font-size:12.5px;color:var(--muted);padding:7px 0 9px;position:relative}
.ptabs button.on{color:var(--ink);font-weight:700}
.ptabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--brand)}
.imgbox{top:96px;left:0;right:0;height:490px;background:#F4F0F2;border-radius:12px;overflow:hidden;border:1px solid #E6E0E4;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}

/* ---------- اسلایدر کشویی جشنواره (سبک دیجی‌کالا + درگ با کلیک چپ) ---------- */
.promo-sec{padding:36px 6vw;position:relative;z-index:2;background:var(--paper)}
.promo-box{
  position:relative;border-radius:18px;padding:22px 20px;
  background:linear-gradient(135deg,var(--pbg,#EF394E),var(--pbg2,#D82A49));
  color:var(--ptxt,#fff);
  display:flex;align-items:stretch;gap:16px;
  box-shadow:0 14px 36px rgba(47,43,48,.12);
  overflow:hidden;
}
.promo-side{
  flex:0 0 185px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:10px 8px;gap:10px;
}
.promo-badge{display:inline-block;padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.22);font-size:12px;font-weight:700}
.promo-side h2{font-size:23px;font-weight:700;line-height:1.45;color:inherit}
.promo-side p{font-size:13px;opacity:.9;line-height:1.6}
.promo-more{margin-top:6px;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:13px;font-weight:500;transition:background .2s}
.promo-more:hover{background:rgba(255,255,255,.3)}
.promo-rail-wrap{position:relative;flex:1;min-width:0}
.promo-rail{
  display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;
  padding:4px 2px;scrollbar-width:none;
  cursor:grab;user-select:none;-webkit-user-select:none;
}
.promo-rail.dragging{cursor:grabbing;scroll-behavior:auto}
.promo-rail::-webkit-scrollbar{display:none}
.pcard{
  flex:0 0 188px;background:var(--pcard,#fff);color:var(--ink);
  border-radius:12px;padding:12px;cursor:pointer;
  display:flex;flex-direction:column;
  transition:transform .25s var(--e),box-shadow .25s;
}
.promo-rail.dragging .pcard{pointer-events:none}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.14)}
.pcard .pth{position:relative;height:164px;background:#F6F3F5;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard .pth i{display:block;height:88%;background-repeat:no-repeat}
.pcard h4{margin-top:10px;font-size:14px;font-weight:700;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pcode{font-size:11px;color:var(--muted);direction:ltr;text-align:right;margin-top:2px}
.pcard .pprice{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.pcard .pprice b{font-size:16px;font-weight:700}
.pcard .pprice small{font-size:11px;color:var(--muted)}
.pcard .pold{font-size:12px;color:var(--muted);text-decoration:line-through;text-align:left;min-height:18px}
.pnav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;
  width:38px;height:38px;border-radius:50%;background:#fff;color:var(--ink);
  box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:22px;line-height:36px;text-align:center;
  transition:transform .2s;
}
.pnav:hover{transform:translateY(-50%) scale(1.06)}
.pnav.pr{right:6px}.pnav.pl{left:6px}

.dbadge{
  position:absolute;top:8px;right:8px;z-index:3;
  padding:2px 9px;border-radius:99px;
  background:var(--disc);color:#fff;
  font-size:12px;font-weight:700;line-height:20px;
  box-shadow:0 3px 10px rgba(239,57,78,.3);
}
.dbadge-sm{
  display:inline-block;padding:1px 7px;border-radius:99px;
  background:var(--disc);color:#fff;font-size:11.5px;font-weight:700;line-height:19px;
}

/* ---------- sections ---------- */
section.sec{padding:86px 8vw;position:relative;z-index:2}
.sec h2{font-size:30px;font-weight:700;line-height:1.5;color:var(--ink)}
.sec .sub{margin-top:8px;color:var(--muted);font-size:15.5px;font-weight:400;max-width:620px}
.sec .rule2{width:34px;height:2.5px;border-radius:2px;background:var(--brand);margin:18px 0 0}
#price{background:var(--paper)}
.pfilters{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap}
.pfilters button{padding:7px 18px;border-radius:9px;border:1px solid #DFD8DC;background:#fff;font-size:14px;font-weight:500;color:var(--muted);transition:all .2s}
.pfilters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:20px}
.card{background:#fff;border:1px solid #E8E2E6;border-radius:14px;padding:14px 14px 18px;cursor:pointer;transition:transform .3s var(--e),box-shadow .3s,border-color .3s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:#D3C9CF;box-shadow:0 12px 28px rgba(47,43,48,.07)}
.th{position:relative;height:236px;display:flex;align-items:center;justify-content:center;background:#F6F3F5;border-radius:10px;overflow:hidden}
.th i{display:block;height:88%;background-repeat:no-repeat}
.card-top{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{font-size:16.5px;font-weight:700;color:var(--ink)}
.card .ccode{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid #E5DFE3;padding:1px 8px;border-radius:6px;direction:ltr;white-space:nowrap}
.card .cdesc{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.6}
.card .pr{margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .pr small{font-size:12px;color:var(--muted)}
.card .pr b{font-size:19.5px;font-weight:700;color:var(--ink)}
.card .pr span{font-size:12.5px;color:var(--muted)}
.card .pr s{font-size:13px;color:var(--muted);margin-right:4px}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:500;padding:2px 10px;border-radius:6px;border:1px solid #E5DFE3;background:var(--paper);color:#4A454B}
.chip.c2{border-color:#D8E8EB;background:#F2F8F9;color:#3F6D75}
.chip.c3{border-color:#EADFD8;background:#FBF7F4;color:#6E5A4F}
.feats{margin-top:38px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.feat{padding:26px 24px;border-radius:14px;background:var(--paper);border:1px solid #E4DEE2}
.feat i{display:block;width:10px;height:10px;border-radius:50%;background:var(--brand);margin-bottom:14px}
.feat:nth-child(2) i{background:var(--a2)}
.feat h3{font-size:17.5px;font-weight:700}
.feat p{margin-top:6px;color:var(--muted);font-size:14.5px;font-weight:400}
#contact{background:#E8E1E6;text-align:center}
#contact .sub{margin-inline:auto}
.bigtel{display:inline-block;margin-top:28px;font-size:clamp(28px,5vw,44px);font-weight:500;letter-spacing:.04em;direction:ltr;border-bottom:2px solid var(--brand);padding-bottom:6px;color:var(--ink)}
.crow{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:10px;border:1px solid var(--ink);font-size:15px;font-weight:500;transition:background .25s,color .25s,border-color .25s}
.btn:hover,.btn.fill{background:var(--ink);color:#fff}
.btn.fill:hover{background:var(--value);border-color:var(--value)}
.cinfo{margin-top:24px;color:var(--muted);font-size:15px;line-height:2}

/* ---------- فوتر ---------- */

    cards.push('<a class="fo-card" href="https://t.me/'+encodeURIComponent(tgAd)+'" target="_blank" rel="noopener"><div class="fo-ico"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div><h4>آیدی ادمین در تلگرام</h4><p dir="ltr" style="text-align:right">@'+esc(tgAd)+'</p></div></a>');
  }
  cards.push('<a class="fo-card" href="'+tel+'"><div class="fo-ico"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div><div><h4>تماس مستقیم</h4><p dir="ltr" style="text-align:right">'+show+'</p></div></a>');

  $('#fo').innerHTML='<div class="fo-grid">'+cards.join('')+'</div><div class="fo-bot">'+esc(s.footerText)+'</div>';

  var secs=NAV_ITEMS.map(function(n){return $('#'+n.id)}),as=$$('#links a');
  window.addEventListener('scroll',function(){
    var y=window.scrollY+window.innerHeight*.35,on=0;
    secs.forEach(function(sc,i){if(sc&&sc.offsetTop<=y)on=i});
    as.forEach(function(a,i){a.classList.toggle('on',i===on)});
  },{passive:true});
}

function intro(){
  document.documentElement.classList.remove('pre');
  var rk=RACK_LIST[0];
  if(reduce||!rk)return;
  var E='cubic-bezier(.2,.75,.2,1)',r=rk.root;
  var A=function(el,kf,dur,delay){if(el&&el.animate)el.animate(kf,{duration:dur,delay:delay,easing:E,fill:'backwards'})};
  A($('.railsvg',r),[{opacity:0,clipPath:'inset(-300px 100% -300px -300px)'},{opacity:1,clipPath:'inset(-300px -300px -300px -300px)'}],1000,100);
  A($('#nav'),[{opacity:0},{opacity:1}],900,200);
  rk.els.forEach(function(el,i){A(el,[{opacity:0,translate:'0 -14px'},{opacity:1,translate:'0 0'}],900,250+rk.slotOf(i)*35)});
  $$('.info .ln>span',r).forEach(function(sp,i){A(sp,[{transform:'translateY(105%)',opacity:0},{transform:'translateY(0)',opacity:1}],1000,650+i*70)});
  ['.idx','.rule','.vbtn','.pager','.foot','.hint'].forEach(function(s,i){A($(s,r),[{opacity:0},{opacity:1}],900,900+i*70)});
  if(!document.body.classList.contains('seen'))setTimeout(function(){var el=$('.pieces',r);if(el&&el.animate)el.animate([{translate:'0 0'},{translate:'-26px 0'},{translate:'0 0'},{translate:'-14px 0'},{translate:'0 0'}],{duration:1500,easing:'ease-in-out'})},1900);
}

function seenHint(){
  if(document.body.classList.contains('seen'))return;
  document.body.classList.add('seen');
  try{localStorage.setItem('delband_seen','1')}catch(e){}
}
function onScroll(){
  var y=window.scrollY;
  document.body.classList.toggle('atTop',y<40);
  $('#toTop').classList.toggle('show',y>80);
}
$('#toTop').onclick=function(){closeAllDetails();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})};
$('#scrim').onclick=function(){closeAllDetails()};
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){
  document.documentElement.style.setProperty('--ns',mq.matches?1:Math.max(.62,Math.min(1,window.innerWidth/1440)));
  RACK_LIST.forEach(function(rk){rk.onResize()});
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeAllDetails();closeMenu();return}
  var active=RACK_LIST[0];
  RACK_LIST.forEach(function(rk){
    var r=rk.hero.getBoundingClientRect();
    if(r.top<window.innerHeight*.5&&r.bottom>window.innerHeight*.3)active=rk;
  });
  if(!active)return;
  if(e.key==='ArrowRight')active.next();
  else if(e.key==='ArrowLeft')active.prev();
});
try{if(localStorage.getItem('delband_seen'))document.body.classList.add('seen')}catch(e){}
onScroll();

function start(){
  try{var tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();if(tg.BackButton)tg.BackButton.onClick(function(){closeAllDetails()})}}catch(e){}
  document.documentElement.style.setProperty('--ns',mq.matches?1:Math.max(.62,Math.min(1,window.innerWidth/1440)));

  var firstRackDone=false;
  DATA.layout.forEach(function(blk){
    if(blk.active===false)return;
    if(blk.type==='rack'){
      var rc=DATA.racks.find(function(x){return x.id===blk.id});
      if(rc&&rc.active!==false){
        var rk=createRackSection(rc,!firstRackDone);
        if(rk)firstRackDone=true;
      }
    }else if(blk.type==='promo'){
      var pr=DATA.promos.find(function(x){return x.id===blk.id});
      if(pr)createPromoSection(pr);
    }else if(blk.type==='price')createPriceSection();
    else if(blk.type==='about')createAboutSection();
    else if(blk.type==='contact')createContactSection();
  });

  buildHeaderAndFooter();
  requestAnimationFrame(function(){requestAnimationFrame(intro)});
  setTimeout(function(){document.documentElement.classList.remove('pre')},4000);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
</body>
</html>
