<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>پنل مدیریت دلبند</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Light.woff2') format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
:root{--wall:#ECE6EB;--ink:#32333F;--muted:#6A6B80;--value:#7173A6;--a1:#9D9FE4;--a2:#E9ACA9;--line:rgba(50,51,63,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(90deg,#E4DDE3,#ECE6EB 60%,#F0EAEE);min-height:100vh;color:var(--ink);font-family:'YekanBakh','Yekan Bakh',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.8;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:360px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:22px;padding:34px 28px;text-align:center;box-shadow:0 20px 60px rgba(80,70,110,.1)}
.lbox h1{font-weight:300;font-size:26px}
.lbox p{color:var(--muted);margin:6px 0 22px;font-size:13px}
.err{color:#b4485a;font-size:12.5px;min-height:20px;margin-top:8px}
input[type=text],input[type=password],input[type=number],input[type=tel],textarea{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.85);outline:none;transition:border-color .3s,box-shadow .3s}
input:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(157,159,228,.2)}
textarea{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 20px;border-radius:99px;border:1px solid var(--ink);background:none;transition:background .3s,color .3s;font-size:13.5px}
.btn:hover{background:var(--ink);color:#fff}
.btn.fill{background:var(--ink);color:#fff}.btn.fill:hover{background:var(--value);border-color:var(--value)}
.btn.sm{padding:3px 12px;font-size:12.5px}
.btn.danger{border-color:#b4485a;color:#b4485a}.btn.danger:hover{background:#b4485a;color:#fff}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;background:rgba(236,230,235,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-weight:300;font-size:22px}
.top h1 small{font-size:12.5px;color:var(--muted);margin-right:10px}
.tabs{display:flex;gap:4px;padding:14px 24px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 18px;color:var(--muted);position:relative;white-space:nowrap}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink)}
main{max-width:980px;margin:0 auto;padding:26px 24px 90px}
.pane{display:none}.pane.on{display:block}
.card{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
.card h2{font-weight:400;font-size:17px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.f small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.row{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.5);margin-bottom:10px}
.row.off{opacity:.55}
.row .th{width:64px;height:78px;flex:none;border-radius:10px;background:#F0EAF0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.row .th i{display:block;height:92%;background-repeat:no-repeat}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:500}
.row .nm small{display:block;color:var(--muted)}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.colors .c{display:flex;align-items:center;gap:10px}
.colors input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:9px;background:none;padding:2px}
.colors input[type=text]{direction:ltr;text-align:left;width:110px}
.modal{position:fixed;inset:0;background:rgba(50,51,63,.4);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
.mbox{background:#F4F0F4;border-radius:22px;width:100%;max-width:720px;padding:26px;box-shadow:0 30px 80px rgba(40,30,60,.35)}
.mbox h2{font-weight:300;font-size:22px;margin-bottom:16px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:6px}
.img{border:1px dashed rgba(50,51,63,.3);border-radius:14px;padding:10px;text-align:center;background:rgba(255,255,255,.5)}
.img .pv{height:130px;border-radius:9px;background:#F0EAF0 center/contain no-repeat;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.img label{display:inline-block}
.img input[type=file]{display:none}
.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.4s;z-index:200}
.toast.on{opacity:1;transform:translateX(50%)}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
@media(max-width:640px){.row{flex-wrap:wrap}.row .btns{width:100%;justify-content:flex-start}.top,.tabs,main{padding-inline:14px}}
</style>
</head>
<body>

<div class="login" id="login">
  <form class="lbox" id="lform">
    <h1>پنل مدیریت دلبند</h1>
    <p>برای ورود رمز عبور را وارد کنید.</p>
    <input type="password" id="pw" placeholder="رمز عبور" autocomplete="current-password" style="text-align:center;direction:ltr">
    <div class="err" id="lerr"></div>
    <button class="btn fill" style="margin-top:8px;width:100%">ورود</button>
  </form>
</div>

<div id="app" hidden>
  <div class="top">
    <h1>پنل مدیریت <small>فروشگاه دلبند</small></h1>
    <div class="bar" style="margin:0"><a class="btn sm" href="index.html" target="_blank">مشاهدهٔ سایت</a><button class="btn sm" id="logout">خروج</button></div>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="products" class="on">لباس‌ها و قیمت</button>
    <button data-t="texts">متن‌های صفحه</button>
    <button data-t="contact">تماس و فوتر</button>
    <button data-t="look">رنگ‌ها</button>
    <button data-t="settings">تنظیمات و پشتیبان</button>
  </div>
  <main>
    <div class="pane on" id="p-products">
      <div class="bar" style="margin:0 0 16px"><button class="btn fill" id="addP">+ افزودن لباس</button><span class="note" style="margin:0">ترتیب این لیست همان ترتیب لباس‌ها روی ریل است.</span></div>
      <div id="plist"></div>
    </div>
    <div class="pane" id="p-texts"></div>
    <div class="pane" id="p-contact"></div>
    <div class="pane" id="p-look"></div>
    <div class="pane" id="p-settings"></div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var KEY='delband_shop_v1';
var DP=[
[1,'پیراهن','اسموک','پنبهٔ نرم و برسی با دوخت','اسموک دست‌دوز؛ مناسب بازی و خواب.','پنبه ارگانیک','پریوینکل / صورتی / شیری','۲ / ۴ / ۶ سال',320000],
[2,'پیراهن','موسلین','گاز دولایهٔ سبک با آستین‌های','پروانه‌ای برای روزهای گرم.','موسلین پنبه','سفید شیری','۲ / ۴ / ۶ سال',290000],
[3,'ژاکت','پوینتل','بافت ظریف پوینتل با دکمه‌های','چوبی؛ سبک و مناسب لایه‌بندی.','بافت پنبه','صورتی کمرنگ','۱ / ۲ / ۴ سال',340000],
[4,'سارافون','جین','جین شسته و نرم با دامن پرچین','و بندهای قابل تنظیم.','جین پنبه','آبی بنفش','۲ / ۴ / ۶ سال',410000],
[5,'بلوز','یقه‌چین','پنبهٔ کرینکل با یقهٔ چین‌دار','پهن و آستین‌های پفی.','کرینکل پنبه','طوسی یاسی','۲ / ۴ / ۶ سال',305000],
[6,'تونیک','برودری','برودری با شانه‌های چین‌دار','و برش گشاد و راحت.','برودری پنبه','سفید شیری','۲ / ۴ / ۶ سال',330000],
[7,'سارافون','کتان','کتان شسته با بند دکمه‌دار','و دو جیب بزرگ روی دامن.','کتان ۱۰۰٪','صورتی کمرنگ','۲ / ۴ / ۶ سال',360000],
[8,'پلیور','بافت نرم','بافت پنبه‌ای شبکه‌باز با','یقهٔ گرد و راحت.','بافت پنبه','پریوینکل','۱ / ۲ / ۴ سال',345000],
[9,'پیراهن','چین‌دار','پنبهٔ پینتاک با شانه‌های','چین‌دار و سر آستین کش.','پنبه ارگانیک','سفید شیری','۲ / ۴ / ۶ سال',315000],
[10,'سارافون','جیب‌دار','پارچهٔ تویل نرم با بندهای چین‌دار','و جیب برای گنجینه‌های کوچک.','تویل پنبه','طوسی یاسی','۲ / ۴ / ۶ سال',335000],
[11,'پیراهن','چهارخانه','چهارخانهٔ اسموک با آستین','کوتاه پفی برای روزهای آفتابی.','گینگهم پنبه','صورتی / کرم','۲ / ۴ / ۶ سال',325000],
[12,'جلیقه','کوئیلت','کوئیلت سبک با دکمه‌های','چوبی؛ گرم و بدون حجم.','کوئیلت پنبه','پریوینکل روشن','۱ / ۲ / ۴ سال',380000]
];
var DEF={admin:{password:'1234'},site:{
brand:'دلبند',logo:'logo.png',nav:['لباس‌ها','لیست قیمت عمده','درباره ما','تماس'],
hint1:'کلیک برای دیدن',hint2:'کلیک دوباره برای آوردن به جلو',viewBtn:'مشاهده جزئیات',back:'بازگشت به مجموعه',
tabs:['روی چوب‌لباسی','پارچه','جزئیات'],
caps:['روی یک چوب‌لباسی چوبی کوچک آویزان است.','لمسی نرم؛ شسته‌شده برای راحتی کودک.','ریزه‌کاری‌هایی که ماندگار دوخته شده‌اند.'],
lPrice:'قیمت عمده',lSize:'سایزبندی',lColor:'رنگ‌بندی',lMat:'جنس',unit:'تومان',
footTag:'دلبند · فروش عمدهٔ پوشاک بچه‌گانه',
priceTitle:'لیست قیمت عمده',priceSub:'همهٔ قیمت‌ها برای فروش عمده و به تومان است. برای ثبت سفارش با ما تماس بگیرید.',
aboutTitle:'دلبند؛ لباس نرم برای کودکان',
aboutText:'دلبند مجموعه‌ای از لباس‌های آرام و پاستلی برای کودکان است؛ از پنبهٔ نرم و دوخت‌های ساده که برای بازی، خواب و روزهای آفتابی ساخته شده‌اند.',
features:[{t:'قیمت عمده',x:'قیمت‌های ویژه برای فروشگاه‌ها و خرده‌فروشان.'},{t:'سایزبندی کامل',x:'سایزهای یک تا شش سال در هر مدل.'},{t:'رنگ‌بندی پاستلی',x:'رنگ‌های آرام و هماهنگ، قابل ست‌شدن با هم.'}],
contactTitle:'سفارش عمده',contactText:'برای دریافت کاتالوگ کامل و ثبت سفارش، هر زمان با ما تماس بگیرید.',
phone:'09183749713',telegram:'',address:'',hours:'',footerText:'© تمام حقوق برای دلبند محفوظ است.',
colors:{wall:'#ECE6EB',ink:'#32333F',muted:'#6A6B80',value:'#7173A6',a1:'#9D9FE4',a2:'#E9ACA9'}},
products:DP.map(function(r){return{id:'p'+r[0],sprite:r[0],active:true,t1:r[1],t2:r[2],d1:r[3],d2:r[4],material:r[5],colors:r[6],sizes:r[7],price:r[8],images:{}}})};

var SPR=[[120,54,560,742],[982,56,508,708],[1792,62,558,588],[2638,54,514,726],[110,865,596,652],[938,869,610,650],[1844,855,456,718],[2614,861,570,630],[112,1661,592,712],[996,1661,492,716],[1832,1663,478,714],[2682,1673,434,630]];
var GURL='https://images.higgs.ai/?default=1&output=webp&url='+encodeURIComponent('https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261113_121624_09fa35c4-680e-46a5-b6a9-8acd429bce67.png')+'&w=3312&q=85';

var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){n=Number(n)||0;try{return n.toLocaleString('fa-IR')}catch(e){return String(n)}};
var toEn=function(s){return String(s).replace(/[۰-۹]/g,function(d){return'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return'٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[٬,،\s]/g,'')};

function load(){
  try{var r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.products&&r.site){r.admin=Object.assign({},DEF.admin,r.admin||{});r.site=Object.assign({},DEF.site,r.site);r.site.colors=Object.assign({},DEF.site.colors,r.site.colors||{});return r}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
var D=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D));return true}
  catch(e){toast('حافظه پر است؛ تصاویر کوچک‌تری بارگذاری کنید.',true);return false}
}
var tt;
function toast(m,bad){var t=$('#toast');t.textContent=m;t.style.background=bad?'#b4485a':'';t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}

/* ---------- ورود ---------- */
function showApp(){$('#login').hidden=true;$('#app').hidden=false;renderAll()}
if(sessionStorage.getItem('dl_auth')==='1')showApp();
$('#lform').onsubmit=function(e){
  e.preventDefault();
  if($('#pw').value===D.admin.password){sessionStorage.setItem('dl_auth','1');save();showApp()}
  else $('#lerr').textContent='رمز عبور اشتباه است.';
};
$('#logout').onclick=function(){sessionStorage.removeItem('dl_auth');location.reload()};
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}}catch(e){}

/* ---------- تب‌ها ---------- */
$('#tabs').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  $$('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  $$('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+b.dataset.t)});
};

/* ---------- محصولات ---------- */
function thumb(p){
  var im=p.images||{};
  if(im.hanger)return'<i style="aspect-ratio:1;width:92%;background:url(\''+im.hanger+'\') center/contain no-repeat"></i>';
  if(p.sprite>=1&&p.sprite<=12){var d=SPR[p.sprite-1];return'<i style="aspect-ratio:'+d[2]+'/'+d[3]+';background-image:url(\''+GURL+'\');background-size:'+(3312/d[2]*100)+'% '+(2480/d[3]*100)+'%;background-position:'+(d[0]/(3312-d[2])*100)+'% '+(d[1]/(2480-d[3])*100)+'%"></i>'}
  return'<span style="font-size:11px;color:#6A6B80">بدون تصویر</span>';
}
function renderProducts(){
  var L=$('#plist');
  if(!D.products.length){L.innerHTML='<p class="note">هنوز لباسی ثبت نشده است.</p>';return}
  L.innerHTML=D.products.map(function(p,i){
    return'<div class="row'+(p.active===false?' off':'')+'" data-i="'+i+'"><div class="th">'+thumb(p)+'</div>'+
    '<div class="nm"><b>'+esc(p.t1+' '+p.t2)+'</b><small>قیمت عمده: '+money(p.price)+' '+esc(D.site.unit)+' · '+esc(p.sizes)+'</small></div>'+
    '<label class="chk"><input type="checkbox" data-a="act" '+(p.active!==false?'checked':'')+'> نمایش</label>'+
    '<div class="btns"><button class="btn sm" data-a="up" title="بالا">↑</button><button class="btn sm" data-a="dn" title="پایین">↓</button><button class="btn sm" data-a="ed">ویرایش</button><button class="btn sm danger" data-a="del">حذف</button></div></div>';
  }).join('');
}
$('#plist').onclick=function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var i=+b.closest('.row').dataset.i,a=b.dataset.a,A=D.products;
  if(a==='act'){A[i].active=b.checked;save();renderProducts();return}
  if(a==='up'&&i>0){var t=A[i];A[i]=A[i-1];A[i-1]=t;save();renderProducts()}
  if(a==='dn'&&i<A.length-1){var t2=A[i];A[i]=A[i+1];A[i+1]=t2;save();renderProducts()}
  if(a==='ed')openForm(i);
  if(a==='del'&&confirm('این لباس حذف شود؟')){A.splice(i,1);save();renderProducts();toast('حذف شد.')}
};
$('#addP').onclick=function(){openForm(-1)};

var cur=null;
function openForm(i){
  var isNew=i<0;
  cur={i:i,p:isNew?{id:'p'+Date.now(),sprite:null,active:true,t1:'',t2:'',d1:'',d2:'',material:'',colors:'',sizes:'',price:0,images:{}}:JSON.parse(JSON.stringify(D.products[i]))};
  if(!cur.p.images)cur.p.images={};
  var p=cur.p;
  $('#mbox').innerHTML='<h2>'+(isNew?'افزودن لباس':'ویرایش لباس')+'</h2>'+
  '<div class="grid2">'+
  fld('t1','عنوان (خط اول)',p.t1)+fld('t2','عنوان (خط دوم)',p.t2)+
  fld('d1','توضیح (خط اول)',p.d1)+fld('d2','توضیح (خط دوم)',p.d2)+
  fld('material','جنس',p.material)+
  fld('sizes','سایزبندی',p.sizes,'مثال: ۲ / ۴ / ۶ سال')+
  fld('colors','رنگ‌بندی',p.colors,'رنگ‌ها را با «/» جدا کنید؛ مثال: صورتی / شیری')+
  '<div class="f"><label>قیمت عمده (تومان)</label><input type="text" inputmode="numeric" id="f_price" value="'+(p.price||'')+'"><small id="f_pv"></small></div>'+
  '</div>'+
  '<label class="chk" style="margin-top:14px"><input type="checkbox" id="f_act" '+(p.active!==false?'checked':'')+'> نمایش در سایت</label>'+
  '<h2 style="margin-top:22px;font-size:15px">تصاویر</h2>'+
  '<p class="note" style="margin:0 0 8px">«روی چوب‌لباسی» همان تصویری است که روی ریل نمایش داده می‌شود: بهتر است PNG/WebP با پس‌زمینهٔ شفاف و با قلاب آویز در بالا‌وسط تصویر باشد. برای لباس‌های نمونه، تصویر خالی یعنی استفاده از تصویر پیش‌فرض.</p>'+
  '<div class="imgs">'+imgBox('hanger','روی چوب‌لباسی (ریل)')+imgBox('fabric','پارچه')+imgBox('detail','جزئیات')+'</div>'+
  '<h2 style="margin-top:22px;font-size:15px">عکس‌های بیشتر (گالری)</h2><p class="note" style="margin:0 0 8px">این عکس‌ها بعد از سه عکس بالا در اسلایدر جزئیات نمایش داده می‌شوند. هر تعداد که بخواهید؛ فقط حافظهٔ مرورگر محدود است.</p><div class="imgs" id="gal"></div><label class="btn sm" style="margin-top:10px"><input type="file" accept="image/*" multiple id="gIn" hidden>+ افزودن عکس</label>'+
  '<div class="bar"><button class="btn fill" id="f_save">ذخیره</button><button class="btn" id="f_cancel">انصراف</button></div>';
  $('#modal').hidden=false;
  $('#f_cancel').onclick=closeForm;
  $('#f_save').onclick=saveForm;
  $('#f_price').oninput=function(){var n=toEn(this.value);$('#f_pv').textContent=n&&!isNaN(n)?money(n)+' تومان':''};
  $('#f_price').oninput();
  if(!cur.p.gallery)cur.p.gallery=[];
  paintGal();
  $('#gIn').onchange=function(){Array.prototype.slice.call(this.files).forEach(function(f){shrink(f,900,function(u){cur.p.gallery.push(u);paintGal()})});this.value=''};
  ['hanger','fabric','detail'].forEach(function(k){
    $('#in_'+k).onchange=function(){
      var f=this.files[0];if(!f)return;
      shrink(f,k==='hanger'?900:800,function(u){cur.p.images[k]=u;paintImg(k)});
    };
    $('#rm_'+k).onclick=function(){delete cur.p.images[k];paintImg(k)};
    paintImg(k);
  });
}
function paintGal(){
  var g=$('#gal');if(!g)return;
  g.innerHTML=cur.p.gallery.map(function(u,i){return'<div class="img"><div class="pv" style="background-image:url(\''+u+'\')"></div><button class="btn sm danger" type="button" data-gi="'+i+'">حذف</button></div>'}).join('');
  $$('[data-gi]',g).forEach(function(b){b.onclick=function(){cur.p.gallery.splice(+b.dataset.gi,1);paintGal()}});
}
function fld(id,l,v,h){return'<div class="f"><label>'+l+'</label><input type="text" id="f_'+id+'" value="'+esc(v)+'">'+(h?'<small>'+h+'</small>':'')+'</div>'}
function imgBox(k,l){return'<div class="img"><div class="pv" id="pv_'+k+'"></div><div style="font-size:12.5px;margin-bottom:6px">'+l+'</div><label class="btn sm"><input type="file" accept="image/*" id="in_'+k+'">بارگذاری</label> <button class="btn sm danger" id="rm_'+k+'" type="button">حذف</button></div>'}
function paintImg(k){var u=cur.p.images[k],e=$('#pv_'+k);e.style.backgroundImage=u?'url("'+u+'")':'none';e.textContent=u?'':(k==='hanger'&&cur.p.sprite?'تصویر پیش‌فرض':'—')}
function shrink(file,max,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    var u=c.toDataURL('image/webp',.85);
    if(u.indexOf('image/webp')<0)u=c.toDataURL('image/png');
    cb(u);
  };im.src=r.result};
  r.readAsDataURL(file);
}
function closeForm(){$('#modal').hidden=true;cur=null}
function saveForm(){
  var p=cur.p,g=function(id){return $('#f_'+id).value.trim()};
  if(!g('t1')){toast('عنوان خط اول لازم است.',true);return}
  var price=toEn($('#f_price').value);
  if(price===''||isNaN(price)){toast('قیمت را به‌صورت عدد وارد کنید.',true);return}
  p.t1=g('t1');p.t2=g('t2');p.d1=g('d1');p.d2=g('d2');p.material=g('material');p.sizes=g('sizes');p.colors=g('colors');
  p.price=Number(price);p.active=$('#f_act').checked;
  var old=cur.i<0?null:JSON.parse(JSON.stringify(D.products[cur.i]));
  if(cur.i<0)D.products.push(p);else D.products[cur.i]=p;
  if(!save()){if(old)D.products[cur.i]=old;else D.products.pop();return}
  closeForm();renderProducts();toast('ذخیره شد.');
}
$('#modal').onclick=function(e){if(e.target===this)closeForm()};

/* ---------- فرم‌های ساده ---------- */
function getP(o,path){return path.split('.').reduce(function(a,k){return a==null?'':a[k]},o)}
function setP(o,path,v){var k=path.split('.'),l=k.pop(),t=k.reduce(function(a,x){return a[x]},o);t[l]=v}
function form(title,fields){
  return'<div class="card"><h2>'+title+'</h2><div class="grid2">'+fields.map(function(f){
    var v=esc(getP(D.site,f[0]));
    return'<div class="f" '+(f[2]==='area'?'style="grid-column:1/-1"':'')+'><label>'+f[1]+'</label>'+(f[2]==='area'?'<textarea data-p="'+f[0]+'">'+v+'</textarea>':'<input type="text" data-p="'+f[0]+'" value="'+v+'"'+(f[2]==='ltr'?' style="direction:ltr;text-align:left"':'')+'>')+'</div>';
  }).join('')+'</div></div>';
}
function renderTexts(){
  var h='';
  h+='<div class="card"><h2>لوگوی هدر</h2><div class="img" style="max-width:300px;margin:0 auto"><div class="pv" id="pv_logo" style="height:100px"></div><div class="bar" style="justify-content:center;margin-top:8px"><label class="btn sm fill"><input type="file" accept="image/*" id="in_logo">انتخاب لوگوی جدید</label><button class="btn sm" id="def_logo" type="button">لوگوی پیش‌فرض</button><button class="btn sm danger" id="rm_logo" type="button">حذف (نمایش متن)</button></div></div><p class="note" style="text-align:center">بهتر است تصویر لوگو با پس‌زمینه شفاف (PNG یا WebP) باشد.</p></div>';
  h+=form('هدر و منو',[['brand','نام برند (متن جایگزین لوگو)'],['nav.0','منو ۱ (اسلایدر)'],['nav.1','منو ۲ (لیست قیمت)'],['nav.2','منو ۳ (درباره ما)'],['nav.3','منو ۴ (تماس)']]);
  h+=form('اسلایدر رگال',[['hint1','راهنمای پایین (کلیک اول)'],['hint2','راهنمای پایین (کلیک دوم)'],['viewBtn','دکمهٔ جزئیات'],['back','دکمهٔ بازگشت'],['tabs.0','نام تب ۱'],['tabs.1','نام تب ۲'],['tabs.2','نام تب ۳'],['caps.0','زیرنویس تب ۱','area'],['caps.1','زیرنویس تب ۲','area'],['caps.2','زیرنویس تب ۳','area'],['lPrice','برچسب قیمت'],['lSize','برچسب سایز'],['lColor','برچسب رنگ'],['lMat','برچسب جنس'],['unit','واحد پول'],['footTag','نوشتهٔ کنار شماره (پایین اسلایدر)']]);
  h+=form('لیست قیمت عمده',[['priceTitle','عنوان بخش'],['priceSub','توضیح بخش','area']]);
  h+=form('درباره ما',[['aboutTitle','عنوان'],['aboutText','متن','area'],['features.0.t','ویژگی ۱ - عنوان'],['features.0.x','ویژگی ۱ - متن'],['features.1.t','ویژگی ۲ - عنوان'],['features.1.x','ویژگی ۲ - متن'],['features.2.t','ویژگی ۳ - عنوان'],['features.2.x','ویژگی ۳ - متن']]);
  h+=form('بخش تماس',[['contactTitle','عنوان'],['contactText','متن','area']]);
  h+='<button class="btn fill" data-save="p-texts">ذخیرهٔ متن‌ها</button>';
  $('#p-texts').innerHTML=h;

  function paintLogo(){
    var pv=$('#pv_logo'), u=D.site.logo;
    pv.style.backgroundImage=u?'url("'+u+'")':'none';
    pv.textContent=u?'':'بدون لوگو (نمایش متن: '+D.site.brand+')';
  }
  paintLogo();
  $('#in_logo').onchange=function(){
    var f=this.files[0]; if(!f)return;
    shrink(f,500,function(u){D.site.logo=u; if(save()){paintLogo(); toast('لوگو ذخیره شد.');}});
    this.value='';
  };
  $('#def_logo').onclick=function(){D.site.logo='logo.png'; if(save()){paintLogo(); toast('لوگوی پیش‌فرض تنظیم شد.');}};
  $('#rm_logo').onclick=function(){D.site.logo=''; if(save()){paintLogo(); toast('لوگو حذف شد.');}};
}
function renderContact(){
  $('#p-contact').innerHTML=form('اطلاعات تماس',[['phone','شمارهٔ تماس (در همهٔ بخش‌های سایت نمایش داده می‌شود)','ltr'],['telegram','آیدی تلگرام (اختیاری، بدون @)','ltr'],['address','نشانی (اختیاری)','area'],['hours','ساعت کاری (اختیاری)']])+
  form('فوتر',[['footerText','متن پایین صفحه']])+'<button class="btn fill" data-save="p-contact">ذخیره</button>';
}
var CN=[['wall','پس‌زمینهٔ دیوار'],['ink','رنگ متن اصلی'],['muted','رنگ متن کم‌رنگ'],['value','رنگ مقادیر'],['a1','رنگ تأکیدی ۱ (بنفش)'],['a2','رنگ تأکیدی ۲ (صورتی)']];
function renderLook(){
  $('#p-look').innerHTML='<div class="card"><h2>رنگ‌های سایت</h2><div class="colors">'+CN.map(function(c){
    var v=D.site.colors[c[0]];
    return'<div class="c"><input type="color" data-c="'+c[0]+'" value="'+v+'"><div class="f"><label>'+c[1]+'</label><input type="text" data-ct="'+c[0]+'" value="'+v+'"></div></div>';
  }).join('')+'</div><div class="bar"><button class="btn fill" id="saveC">ذخیره</button><button class="btn" id="resC">بازگشت به رنگ‌های پیش‌فرض</button></div></div>';
  $$('[data-c]').forEach(function(i){i.oninput=function(){$('[data-ct="'+i.dataset.c+'"]').value=i.value}});
  $$('[data-ct]').forEach(function(i){i.oninput=function(){if(/^#[0-9a-f]{6}$/i.test(i.value))$('[data-c="'+i.dataset.ct+'"]').value=i.value}});
  $('#saveC').onclick=function(){
    var ok=true;CN.forEach(function(c){var v=$('[data-ct="'+c[0]+'"]').value.trim();if(/^#[0-9a-f]{6}$/i.test(v))D.site.colors[c[0]]=v;else ok=false});
    if(!ok)toast('بعضی رنگ‌ها نامعتبر بود (مثال درست: #ECE6EB).',true);else{save();toast('ذخیره شد.')}
  };
  $('#resC').onclick=function(){D.site.colors=JSON.parse(JSON.stringify(DEF.site.colors));save();renderLook();toast('رنگ‌ها بازنشانی شد.')};
}
function renderSettings(){
  $('#p-settings').innerHTML='<div class="card"><h2>تغییر رمز عبور</h2><div class="grid2"><div class="f"><label>رمز جدید</label><input type="password" id="np1" autocomplete="new-password" style="direction:ltr"></div><div class="f"><label>تکرار رمز جدید</label><input type="password" id="np2" autocomplete="new-password" style="direction:ltr"></div></div><div class="bar"><button class="btn fill" id="chPw">تغییر رمز</button></div></div>'+
  '<div class="card"><h2>پشتیبان‌گیری</h2><p class="note" style="margin:0 0 12px">اطلاعات این نسخه فقط در همین مرورگر ذخیره می‌شود. از آن‌ها نسخهٔ پشتیبان بگیرید.</p><div class="bar" style="margin:0"><button class="btn" id="exp">دریافت فایل پشتیبان</button><label class="btn"><input type="file" id="imp" accept="application/json" hidden>بازیابی از فایل</label><button class="btn danger" id="rst">بازنشانی همه‌چیز</button></div></div>';
  $('#chPw').onclick=function(){
    var a=$('#np1').value,b=$('#np2').value;
    if(a.length<4)return toast('رمز باید دست‌کم ۴ نویسه باشد.',true);
    if(a!==b)return toast('دو رمز یکسان نیستند.',true);
    D.admin.password=a;save();$('#np1').value=$('#np2').value='';toast('رمز تغییر کرد.');
  };
  $('#exp').onclick=function(){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='delband-backup.json';a.click();
  };
  $('#imp').onchange=function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var o=JSON.parse(r.result);if(!o.products||!o.site)throw 0;D=o;D.admin=Object.assign({},DEF.admin,D.admin||{});D.site=Object.assign({},DEF.site,D.site);D.site.colors=Object.assign({},DEF.site.colors,D.site.colors||{});if(save()){renderAll();toast('بازیابی شد.')}}catch(e){toast('فایل معتبر نیست.',true)}};
    r.readAsText(f);
  };
  $('#rst').onclick=function(){if(confirm('همهٔ اطلاعات به حالت اولیه برمی‌گردد. مطمئنید؟')){D=JSON.parse(JSON.stringify(DEF));save();renderAll();toast('بازنشانی شد.')}};
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-save]');if(!b)return;
  $$('[data-p]',$('#'+b.dataset.save)).forEach(function(i){setP(D.site,i.dataset.p,i.value.trim())});
  if(save())toast('ذخیره شد.');
});
function renderAll(){renderProducts();renderTexts();renderContact();renderLook();renderSettings()}
})();
</script>
</body>
</html>
