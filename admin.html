<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>پنل مدیریت دلبند</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<style>
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Light.woff2') format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'YekanBakh';
  src: url('fonts/YekanBakh-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
:root{--wall:#ECE6EB;--ink:#2F2B30;--muted:#6E6770;--value:#558E97;--a1:#9D9FE4;--a2:#E9ACA9;--line:rgba(50,51,63,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(90deg,#E4DDE3,#ECE6EB 60%,#F0EAEE);min-height:100vh;color:var(--ink);font-family:'YekanBakh','Yekan Bakh',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.8;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:360px;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:20px;padding:34px 28px;text-align:center;box-shadow:0 20px 60px rgba(80,70,110,.1)}
.lbox h1{font-weight:700;font-size:24px}
.lbox p{color:var(--muted);margin:6px 0 22px;font-size:13px}
.err{color:#b4485a;font-size:12.5px;min-height:20px;margin-top:8px}
input[type=text],input[type=password],input[type=number],input[type=tel],textarea,select{width:100%;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:var(--value);box-shadow:0 0 0 3px rgba(85,142,151,.18)}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:10px;border:1px solid var(--ink);background:none;transition:background .25s,color .25s;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--ink);color:#fff}
.btn.fill{background:var(--ink);color:#fff}.btn.fill:hover{background:var(--value);border-color:var(--value)}
.btn.pub{background:#1F8A70;border-color:#1F8A70;color:#fff}.btn.pub:hover{background:#176D58;border-color:#176D58}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn.danger{border-color:#b4485a;color:#b4485a}.btn.danger:hover{background:#b4485a;color:#fff}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-weight:700;font-size:19px}
.top h1 small{font-size:12.5px;font-weight:400;color:var(--muted);margin-right:8px}
.tabs{display:flex;gap:4px;padding:8px 24px 0;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 15px;color:var(--muted);position:relative;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--ink);font-weight:700}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;background:var(--value)}
main{max-width:1020px;margin:0 auto;padding:24px 22px 90px}
.pane{display:none}.pane.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.card h2{font-weight:700;font-size:16.5px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.f small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.row{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px}
.row.off{opacity:.52}
.row .th{width:64px;height:78px;flex:none;border-radius:10px;background:#F4F0F2;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.row .th i{display:block;height:92%;background-repeat:no-repeat}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:700}
.row .nm small{display:block;color:var(--muted)}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);white-space:nowrap;cursor:pointer}
.chk-grid{display:flex;flex-wrap:wrap;gap:10px 16px;padding:12px;border-radius:12px;background:#FAF8F6;border:1px solid var(--line)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:500;background:#F2EFF2;color:var(--muted);margin-right:6px}
.tag.red{background:#FEECEF;color:#D82A49;font-weight:700}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.colors .c{display:flex;align-items:center;gap:10px}
.colors input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:9px;background:none;padding:2px;flex:none}
.colors input[type=text]{direction:ltr;text-align:left;width:105px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px;margin-bottom:18px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:#FAF8F6;cursor:pointer;transition:transform .2s,border-color .2s;text-align:right}
.tcard:hover{transform:translateY(-2px);border-color:var(--value)}
.tcard b{display:block;font-size:13.5px;margin-bottom:8px}
.swatches{display:flex;gap:5px}
.swatches i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.modal{position:fixed;inset:0;background:rgba(47,43,48,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:26px 14px}
.mbox{background:#FAF8F6;border-radius:20px;width:100%;max-width:740px;padding:24px;box-shadow:0 30px 80px rgba(40,30,60,.3)}
.mbox h2{font-weight:700;font-size:19px;margin-bottom:14px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:6px}
.img{border:1px dashed rgba(50,51,63,.3);border-radius:14px;padding:10px;text-align:center;background:#fff}
.img .pv{height:124px;border-radius:9px;background:#F4F0F2 center/contain no-repeat;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.img label{display:inline-block}
.img input[type=file]{display:none}
.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.4s;z-index:200}
.toast.on{opacity:1;transform:translateX(50%)}
.note{color:var(--muted);font-size:12.5px;margin-top:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:6px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted)}
.pills button.on{background:var(--ink);border-color:var(--ink);color:#fff}
@media(max-width:640px){.row{flex-wrap:wrap}.row .btns{width:100%;justify-content:flex-start}.top,.tabs,main{padding-inline:14px}}
</style>
</head>
<body>

<div class="login" id="login">
  <form class="lbox" id="lform">
    <h1>پنل مدیریت دلبند</h1>
    <p>برای ورود رمز عبور را وارد کنید.</p>
    <input type="password" id="pw" placeholder="رمز عبور" autocomplete="current-password" style="text-align:center;direction:ltr">
    <div class="err" id="lerr"></div>
    <button class="btn fill" style="margin-top:8px;width:100%">ورود</button>
  </form>
</div>

<div id="app" hidden>
  <div class="top">
    <h1>پنل مدیریت <small>فروشگاه دلبند</small></h1>
    <div class="bar" style="margin:0">
      <button class="btn sm pub" id="pubBtn">▲ انتشار در سایت (گیت‌هاب)</button>

      <a class="btn sm" href="index.html" target="_blank">سایت زنده</a>
      <button class="btn sm" id="logout">خروج</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="products" class="on">محصولات</button>
    <button data-t="layout">چیدمان و رگال‌ها</button>
    <button data-t="promo">اسلایدرهای جشنواره</button>
    <button data-t="texts">لوگو و متن‌ها</button>
    <button data-t="contact">تماس و فوتر</button>
    <button data-t="look">تم و رنگ‌ها</button>
    <button data-t="settings">انتشار، گیت‌هاب و پشتیبان</button>
  </div>
  <main>
    <div class="pane on" id="p-products">
      <div class="bar" style="margin:0 0 14px;justify-content:space-between">
        <button class="btn fill" id="addP">+ افزودن محصول</button>
        <div class="pills" id="rFilter"></div>
      </div>
      <div id="plist"></div>
    </div>
    <div class="pane" id="p-layout"></div>
    <div class="pane" id="p-promo"></div>
    <div class="pane" id="p-texts"></div>
    <div class="pane" id="p-contact"></div>
    <div class="pane" id="p-look"></div>
    <div class="pane" id="p-settings"></div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

function migrate(r){
  r.admin=Object.assign({},DEF.admin,r.admin||{});
  r.site=Object.assign({},DEF.site,r.site||{});
  r.site.colors=Object.assign({},DEF.site.colors,r.site.colors||{});
  if(!r.site.tgAdmin&&r.site.telegram)r.site.tgAdmin=r.site.telegram;
  if(!Array.isArray(r.racks)||!r.racks.length)r.racks=JSON.parse(JSON.stringify(DEF.racks));
  if(!Array.isArray(r.promos)){
    if(r.promo)r.promos=[Object.assign({id:'pr1'},DEF.promos[0],r.promo)];
    else r.promos=JSON.parse(JSON.stringify(DEF.promos));
  }
  r.promos.forEach(function(pr,idx){if(!pr.id)pr.id='pr'+(idx+1);if(!Array.isArray(pr.productIds))pr.productIds=[]});
  if(!Array.isArray(r.products))r.products=JSON.parse(JSON.stringify(DEF.products));
  r.products.forEach(function(p,idx){
    if(!p.rackId)p.rackId=r.racks[0].id;
    if(!p.code)p.code='DB-'+(101+idx);
    if(typeof p.discountOn!=='boolean')p.discountOn=false;
    if(!p.discountPct)p.discountPct=0;
    p.show=Object.assign({},DEF_SHOW,p.show||{});
    if(!p.images)p.images={};
  });
  if(!r._v3){
    if(r.racks.some(function(x){return x.id==='r2'})&&!r.products.some(function(p){return p.rackId==='r2'}))r.products=r.products.concat(makeDefaultPants());
    r._v3=true;
  }
  if(!Array.isArray(r.layout)||!r.layout.length){
    r.layout=JSON.parse(JSON.stringify(DEF.layout));
  }else{
    r.layout.forEach(function(l){if(l.type==='promo'&&(!l.id||l.id==='promo'))l.id=r.promos[0]?r.promos[0].id:'pr1'});
    r.racks.forEach(function(rk){if(!r.layout.some(function(l){return l.type==='rack'&&l.id===rk.id}))r.layout.unshift({type:'rack',id:rk.id,active:rk.active!==false})});
    r.promos.forEach(function(pr){if(!r.layout.some(function(l){return l.type==='promo'&&l.id===pr.id}))r.layout.splice(1,0,{type:'promo',id:pr.id,active:pr.active!==false})});
    ['price','about','contact'].forEach(function(tp){if(!r.layout.some(function(l){return l.type===tp}))r.layout.push({type:tp,id:tp,active:true})});
  }
  return r;
}

function publishToGitHub(){
  var btn=$('#pubBtn');
  var hasWorker=Boolean(GH.workerUrl&&GH.workerUrl.trim());
  var hasDirect=Boolean(GH.repo&&GH.token);
  if(!hasWorker&&!hasDirect){
    toast('ابتدا در تب «انتشار، گیت‌هاب و پشتیبان» مشخصات گیت‌هاب را وارد کنید.',true);
    var st=$('#tabs button[data-t="settings"]');if(st)st.click();
    return;
  }
  btn.disabled=true;btn.textContent='در حال انتشار...';
  var bodyStr=publicPayload();

  if(hasWorker){
    fetch(GH.workerUrl.trim(),{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Key':GH.workerKey||''},
      body:bodyStr
    }).then(function(res){
      if(!res.ok)throw new Error('خطای واسطه ('+res.status+')');
      toast('با موفقیت منتشر شد! حدود ۳۰ ثانیه دیگر در تلگرام آپدیت می‌شود.');
    }).catch(function(err){toast('خطا در انتشار: '+err.message,true)})
    .finally(function(){btn.disabled=false;btn.textContent='▲ انتشار در سایت (گیت‌هاب)'});
    return;
  }

  var repo=GH.repo.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\/+$/,'');
  var branch=(GH.branch||'main').trim();
  var path=(GH.path||'data.json').trim().replace(/^\/+/,'');
  var api='https://api.github.com/repos/'+repo+'/contents/'+path;
  var headers={'Authorization':'Bearer '+GH.token.trim(),'Accept':'application/vnd.github+json','Content-Type':'application/json'};

  fetch(api+'?ref='+encodeURIComponent(branch),{headers:headers,cache:'no-store'})
    .then(function(res){if(res.status===404)return null;if(!res.ok)throw new Error('خطای دسترسی گیت‌هاب ('+res.status+')');return res.json()})
    .then(function(info){
      var payload={message:'به‌روزرسانی محتوای فروشگاه دلبند',content:toBase64UTF8(bodyStr),branch:branch};
      if(info&&info.sha)payload.sha=info.sha;
      return fetch(api,{method:'PUT',headers:headers,body:JSON.stringify(payload)});
    })
    .then(function(res){
      if(!res.ok)throw new Error('ذخیره در گیت‌هاب ناموفق بود ('+res.status+')');
      toast('با موفقیت در گیت‌هاب منتشر شد! تا ۳۰ ثانیه دیگر در تلگرام اعمال می‌شود.');
    })
    .catch(function(err){toast(err.message||'خطا در اتصال به گیت‌هاب',true)})
    .finally(function(){btn.disabled=false;btn.textContent='▲ انتشار در سایت (گیت‌هاب)'});
}

    if(u.indexOf('image/webp')<0)u=c.toDataURL('image/png');
    cb(u);
  };im.src=r.result};

}

      '</div>'+

      return'<div class="c"><input type="color" data-c="'+c[0]+'" value="'+v+'"><div class="f"><label>'+c[1]+'</label><input type="text" data-ct="'+c[0]+'" value="'+v+'"></div></div>';
    }).join('')+'</div><div class="bar"><button class="btn fill" id="saveC">ذخیره رنگ‌ها</button><button class="btn" id="resC">بازگشت به رنگ‌های پیش‌فرض</button></div></div>';

  $$('[data-th]',pane).forEach(function(b){b.onclick=function(){
    D.site.colors=Object.assign({},THEMES[+b.dataset.th].c);
    if(save()){renderLook();toast('تم رنگی اعمال شد (برای نمایش در سایت، «انتشار در سایت» را بزنید).')}
  }});
  $$('[data-c]',pane).forEach(function(i){i.oninput=function(){$('[data-ct="'+i.dataset.c+'"]',pane).value=i.value}});
  $$('[data-ct]',pane).forEach(function(i){i.oninput=function(){if(/^#[0-9a-f]{6}$/i.test(i.value))$('[data-c="'+i.dataset.ct+'"]',pane).value=i.value}});
  $('#saveC').onclick=function(){
    var ok=true;CN.forEach(function(c){var v=$('[data-ct="'+c[0]+'"]',pane).value.trim();if(/^#[0-9a-f]{6}$/i.test(v))D.site.colors[c[0]]=v;else ok=false});
    if(!ok)toast('بعضی رنگ‌ها نامعتبر بود (مثال درست: #ECE6EB).',true);else{save();toast('ذخیره شد.')}
  };
  $('#resC').onclick=function(){D.site.colors=JSON.parse(JSON.stringify(DEF.site.colors));save();renderLook();toast('رنگ‌ها بازنشانی شد.')};
}

/* ---------- تنظیمات انتشار خودکار گیت‌هاب، رمز و پشتیبان ---------- */
function renderSettings(){
  $('#p-settings').innerHTML=
  '<div class="card"><h2>انتشار خودکار و امن در گیت‌هاب (برای آپدیت مینی‌اپ تلگرام)</h2>'+
    '<p class="note" style="margin:0 0 14px">توکن فقط روی همین دستگاه ذخیره می‌شود و هرگز داخل کدها یا گیت‌هاب قرار نمی‌گیرد. از Fine-Grained Token محدود به همین یک مخزن استفاده کنید.</p>'+
    '<div class="grid2">'+
      '<div class="f"><label>نام مخزن گیت‌هاب (username/repo)</label><input type="text" id="gh_repo" value="'+esc(GH.repo)+'" placeholder="مثلاً: ali/delband" style="direction:ltr;text-align:left"></div>'+
      '<div class="f"><label>شاخه (Branch)</label><input type="text" id="gh_br" value="'+esc(GH.branch||'main')+'" style="direction:ltr;text-align:left"></div>'+
      '<div class="f" style="grid-column:1/-1"><label>توکن اختصاصی گیت‌هاب (فقط روی این دستگاه ذخیره می‌شود)</label><input type="password" id="gh_tok" value="'+esc(GH.token)+'" placeholder="github_pat_..." style="direction:ltr;text-align:left"></div>'+
      '<div class="f"><label>آدرس سرور واسطه (اختیاری - مثلاً Cloudflare Worker)</label><input type="text" id="gh_wk" value="'+esc(GH.workerUrl||'')+'" placeholder="https://..." style="direction:ltr;text-align:left"></div>'+
      '<div class="f"><label>کلید امنیتی واسطه (اختیاری)</label><input type="password" id="gh_wkey" value="'+esc(GH.workerKey||'')+'" style="direction:ltr;text-align:left"></div>'+
    '</div>'+
    '<div class="bar">'+
      '<button class="btn fill" id="saveGH">ذخیره تنظیمات انتشار</button>'+
      '<button class="btn pub" id="pubNow">▲ انتشار همین الان</button>'+
      '<button class="btn" id="pullGH">دریافت آخرین نسخه از سایت</button>'+
      '<button class="btn" id="dlData">دانلود دستی data.json</button>'+
    '</div></div>'+

  '<div class="card"><h2>تغییر رمز عبور پنل مدیریت</h2><div class="grid2"><div class="f"><label>رمز جدید</label><input type="password" id="np1" autocomplete="new-password" style="direction:ltr"></div><div class="f"><label>تکرار رمز جدید</label><input type="password" id="np2" autocomplete="new-password" style="direction:ltr"></div></div><div class="bar"><button class="btn fill" id="chPw">تغییر رمز</button></div></div>'+

  '<div class="card"><h2>پشتیبان‌گیری</h2><div class="bar" style="margin:0"><button class="btn" id="exp">دریافت فایل پشتیبان</button><label class="btn"><input type="file" id="imp" accept="application/json" hidden>بازیابی از فایل</label><button class="btn danger" id="rst">بازنشانی همه‌چیز</button></div></div>';

  $('#saveGH').onclick=function(){
    GH={repo:$('#gh_repo').value.trim(),branch:$('#gh_br').value.trim()||'main',path:'data.json',token:$('#gh_tok').value.trim(),workerUrl:$('#gh_wk').value.trim(),workerKey:$('#gh_wkey').value.trim()};
    try{localStorage.setItem(GH_KEY,JSON.stringify(GH));toast('تنظیمات انتشار ذخیره شد.')}catch(e){toast('خطا در ذخیره تنظیمات.',true)}
  };
  $('#pubNow').onclick=function(){$('#saveGH').click();publishToGitHub()};
  $('#pullGH').onclick=function(){
    fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(remote){
      var keepAdm=D.admin;D=migrate(remote);D.admin=keepAdm;
      if(save()){renderAll();toast('آخرین نسخهٔ منتشرشده از سایت بارگذاری شد.')}
    }).catch(function(){toast('فایل data.json روی سایت پیدا نشد.',true)});
  };
  $('#dlData').onclick=function(){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([publicPayload()],{type:'application/json'}));a.download='data.json';a.click();
  };
  $('#chPw').onclick=function(){
    var a=$('#np1').value,b=$('#np2').value;
    if(a.length<4)return toast('رمز باید دست‌کم ۴ نویسه باشد.',true);
    if(a!==b)return toast('دو رمز یکسان نیستند.',true);
    D.admin.password=a;save();$('#np1').value=$('#np2').value='';toast('رمز تغییر کرد.');
  };
  $('#exp').onclick=function(){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='delband-backup.json';a.click();
  };
  $('#imp').onchange=function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var o=JSON.parse(r.result);if(!o.site)throw 0;var adm=D.admin;D=migrate(o);if(!o.admin)D.admin=adm;if(save()){renderAll();toast('بازیابی شد.')}}catch(e){toast('فایل معتبر نیست.',true)}};
    r.readAsText(f);
  };
  $('#rst').onclick=function(){askConfirm('همهٔ اطلاعات به حالت اولیه برمی‌گردد. مطمئنید؟',function(){D=migrate(JSON.parse(JSON.stringify(DEF)));save();renderAll();toast('بازنشانی شد.')})};
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-save]');if(!b)return;
  $$('[data-p]',$('#'+b.dataset.save)).forEach(function(i){setP(D.site,i.dataset.p,i.value.trim())});
  if(save())toast('ذخیره شد.');
});
function renderAll(){renderProducts();renderLayout();renderPromos();renderTexts();renderContact();renderLook();renderSettings()}
})();
</script>
</body>
</html>
